<!doctype html><html lang="fr"><meta charset="utf-8"><title>Audit MedInfo — export local inchangé</title>
<style>*{box-sizing:border-box}body{margin:0;background:#e6e8eb;font:14px Arial}header{height:60px;display:flex;align-items:center;gap:12px;padding:8px;background:#fff;width:1440px}select,button{padding:8px;font:inherit}iframe{display:block;border:0;background:#fff;margin:0}pre{width:1440px;white-space:pre-wrap;background:#fff;margin:0;padding:16px}#ready{font-weight:bold}</style>
<header><label>Écran <select id="route" aria-label="Écran"></select></label><label>Largeur <select id="width" aria-label="Largeur"><option>390</option><option>768</option><option>1024</option><option selected>1440</option></select></label><button id="open">Afficher</button><button id="audit">Analyser avec axe</button><span id="ready" role="status">Préparation</span></header>
<iframe id="view" title="Export web MedInfo" width="1440" height="900"></iframe><pre id="report"></pre>
<script>
const routes=[['landing','/'],['chat-public','/chat?bot=public'],['chat-student','/chat?bot=student'],['chat-professional','/chat?bot=professional'],['sign-in','/sign-in'],['sign-up','/sign-in?mode=signup'],['reset-password','/reset-password'],['dashboard','/dashboard'],['document','/document'],['ecos','/ecos'],['scores','/scores'],['partiel','/partiel'],['revision','/revision'],['cv-builder','/cv-builder'],['presentation','/presentation'],['article','/article'],['audio','/audio'],['pricing','/pricing'],['account','/account'],['choose-role','/choose-role'],['blog','/blog'],['blog-missing','/blog/audit-slug-inexistant'],['a-propos','/a-propos'],['contact','/contact'],['legal','/legal'],['cgu','/cgu'],['confidentialite','/confidentialite'],['mentions-legales','/mentions-legales'],['admin','/(admin)'],['standalone-partiel','/partiel.html'],['standalone-presentation','/presentation.html'],['standalone-cv','/cv-builder.html'],['standalone-article','/article.html'],['A-landing','/__directions/direction-a-landing.html'],['A-chat','/__directions/direction-a-chat.html'],['A-tool','/__directions/direction-a-document.html'],['B-landing','/__directions/direction-b-landing.html'],['B-chat','/__directions/direction-b-chat.html'],['B-tool','/__directions/direction-b-document.html']];
route.innerHTML=routes.map(([name,url])=>'<option value="'+url+'">'+name+'</option>').join('');
let axeReady=false;
async function show(){ready.textContent='Chargement';report.textContent='';axeReady=false;view.width=width.value;view.height=+width.value===390?844:900;view.src=route.value;}
view.addEventListener('load',async()=>{try{await view.contentDocument.fonts.ready;setTimeout(()=>{ready.textContent='Prêt · '+width.value+' px';},650);}catch{ready.textContent='Erreur de cadre';}});
open.onclick=show;document.getElementById('open').onclick=show;
document.getElementById('audit').onclick=async()=>{ready.textContent='Analyse';try{const d=view.contentDocument,w=view.contentWindow;if(!axeReady){await new Promise((resolve,reject)=>{const s=d.createElement('script');s.src='/__axe.js';s.onload=resolve;s.onerror=reject;d.head.append(s);});axeReady=true;}const r=await w.axe.run(d,{runOnly:{type:'tag',values:['wcag2a','wcag2aa','wcag21aa','wcag22aa']}});const interactive=[...d.querySelectorAll('button,a,[role="button"],[role="tab"],input,textarea,select')].map(e=>({label:(e.getAttribute('aria-label')||e.textContent||e.getAttribute('placeholder')||'').trim().slice(0,90),rect:e.getBoundingClientRect().toJSON()})).filter(x=>x.rect.width>0&&x.rect.height>0);report.textContent=JSON.stringify({route:route.value,width:w.innerWidth,height:w.innerHeight,title:d.title,headings:[...d.querySelectorAll('h1,h2,[role="heading"]')].map(e=>e.textContent),text:d.body.innerText.slice(0,1100),overflow:d.documentElement.scrollWidth>w.innerWidth,smallControls:interactive.filter(e=>e.rect.width<44||e.rect.height<44).map(e=>({label:e.label,width:e.rect.width,height:e.rect.height})),violations:r.violations.map(v=>({id:v.id,impact:v.impact,help:v.help,helpUrl:v.helpUrl,nodes:v.nodes.map(n=>({html:n.html,target:n.target,summary:n.failureSummary}))})),incomplete:r.incomplete.map(v=>({id:v.id,count:v.nodes.length})),passes:r.passes.length},null,2);ready.textContent='Audit terminé';}catch(e){report.textContent=String(e);ready.textContent='Échec audit';}};
show();
</script></html>
