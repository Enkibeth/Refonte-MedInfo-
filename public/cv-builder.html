    }).join('\n');
    document.head.appendChild(el('style', { text: rules }));
    // Les métriques écran changent une fois la police chargée : on remesure.
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(function () { metricsCache = {}; renderPreview(); });
    }
  }

  function canvasCtx() {
    if (!measureCanvas) measureCanvas = document.createElement('canvas');
    return measureCanvas.getContext('2d');
  }
  function cssFont(prim, size) {
    return (prim.italic ? 'italic ' : '') + (prim.bold ? '700 ' : '400 ') + size + 'px ' + cssFamily(prim.fam);
  }
  /** Ascendante réelle de la police écran : place la ligne de base au bon endroit. */
  function fontMetrics(fam, bold, italic) {
    var key = fam + (bold ? 'b' : '') + (italic ? 'i' : '');
    if (metricsCache[key]) return metricsCache[key];
    var m = FALLBACK_METRICS[familyMeta(fam).kind === 'serif' ? 'serif' : 'sans'];
    try {
      var ctx = canvasCtx();
      ctx.font = cssFont({ fam: fam, bold: bold, italic: italic }, 100);
      var probe = ctx.measureText('Hxg');
      if (probe && probe.fontBoundingBoxAscent) {
        m = { asc: probe.fontBoundingBoxAscent / 100, desc: probe.fontBoundingBoxDescent / 100 };
      }
    } catch (_) {}
    metricsCache[key] = m;
    return m;
  }
  /** Largeur écran d'un texte (pour corriger l'écart avec les métriques PDF). */
  function screenWidth(prim, size) {
    try {
      var ctx = canvasCtx();
      ctx.font = cssFont(prim, size);
      return ctx.measureText(prim.s).width + (prim.tr ? prim.tr * (prim.s.length - 1) : 0) * (size / prim.size);
    } catch (_) { return 0; }
  }

  var SVG_NS = 'http://www.w3.org/2000/svg';
  function svg(tag, attrs) {
    var node = document.createElementNS(SVG_NS, tag);
    for (var k in attrs) if (Object.prototype.hasOwnProperty.call(attrs, k)) node.setAttribute(k, attrs[k]);
    return node;
  }

  function shapeNode(p) {
    if (p.t === 'rect') {
      var r = svg('rect', { x: p.x, y: p.y, width: Math.max(0, p.w), height: Math.max(0, p.h) });
      if (p.r) { r.setAttribute('rx', p.r); r.setAttribute('ry', p.r); }
      r.setAttribute('fill', p.fill || 'none');
      if (p.stroke) { r.setAttribute('stroke', p.stroke); r.setAttribute('stroke-width', p.lw || 0.5); }
      return r;
    }
    if (p.t === 'line') {
      return svg('line', { x1: p.x1, y1: p.y1, x2: p.x2, y2: p.y2, stroke: p.stroke || '#000', 'stroke-width': p.lw || 0.5 });
    }
    if (p.t === 'circle') {
      var c = svg('circle', { cx: p.cx, cy: p.cy, r: Math.max(0, p.r) });
      c.setAttribute('fill', p.fill || 'none');
      if (p.stroke) { c.setAttribute('stroke', p.stroke); c.setAttribute('stroke-width', p.lw || 0.5); }
      return c;
    }
    if (p.t === 'ellipse') {
      var e2 = svg('ellipse', { cx: p.x, cy: p.y, rx: p.rx, ry: p.ry, fill: 'none', stroke: p.stroke || '#000', 'stroke-width': p.lw || 0.5 });
      return e2;
    }
    if (p.t === 'poly') {
      return svg('polygon', {
        points: p.pts.map(function (pt) { return pt[0] + ',' + pt[1]; }).join(' '),
        fill: p.fill || 'none', stroke: p.stroke || 'none', 'stroke-width': p.lw || 0.5,
      });
    }
    return null;
  }

  /**
   * Couleur du papier DERRIÈRE la photo. Elle est peinte dans l'image découpée :
   * le masque (cercle, coins arrondis) n'a alors plus besoin de transparence, donc
   * la photo part en JPEG et non en PNG + couche alpha — un PNG avec alpha pèse
   * ~800 ko dans le PDF là où le JPEG en fait ~30, pour un rendu identique.
   */
  function photoBackdrop() {
    var t = S.doc.theme;
    var inSidebar = t.headerStyle === 'split' && t.sidebar.enabled;
    return inSidebar ? t.sidebarBackground : '#ffffff';
  }

  /** Photo recadrée + masquée : générée UNE fois, puis réutilisée à l'écran ET dans le PDF. */
  function ensurePhotoRender() {
    var photo = S.doc.header.photo;
    if (!photo) { S.photoCache = { key: '', url: '' }; return; }
    var backdrop = photoBackdrop();
    var key = [photo.dataUrl.length, photo.dataUrl.slice(-24), photo.shape, photo.zoom, photo.offsetX, photo.offsetY, backdrop].join('|');
    if (S.photoCache.key === key) return;
    var img = new Image();
    img.onload = function () {
      var size = 460;
      var canvas = document.createElement('canvas');
      canvas.width = size; canvas.height = size;
      var ctx = canvas.getContext('2d');
      ctx.fillStyle = backdrop;
      ctx.fillRect(0, 0, size, size);
      ctx.save();
      if (photo.shape === 'circle') {
        ctx.beginPath(); ctx.arc(size / 2, size / 2, size / 2, 0, Math.PI * 2); ctx.clip();
      } else if (photo.shape === 'rounded') {
        var rad = size * 0.11;
        ctx.beginPath();
        ctx.moveTo(rad, 0); ctx.lineTo(size - rad, 0); ctx.quadraticCurveTo(size, 0, size, rad);
        ctx.lineTo(size, size - rad); ctx.quadraticCurveTo(size, size, size - rad, size);
        ctx.lineTo(rad, size); ctx.quadraticCurveTo(0, size, 0, size - rad);
        ctx.lineTo(0, rad); ctx.quadraticCurveTo(0, 0, rad, 0);
        ctx.closePath(); ctx.clip();
      }
      var scale = (size / Math.min(img.width, img.height)) * photo.zoom;
      var w = img.width * scale, h = img.height * scale;
      var x = (size - w) / 2 + ((w - size) / 2) * photo.offsetX;
      var y = (size - h) / 2 + ((h - size) / 2) * photo.offsetY;
      ctx.drawImage(img, x, y, w, h);
      ctx.restore();
      S.photoCache = { key: key, url: canvas.toDataURL('image/jpeg', 0.9) };
      renderPreview();
    };
    img.onerror = function () { S.photoCache = { key: key, url: '' }; };
    img.src = photo.dataUrl;
  }

  function selectionFromPath(path) {
    var parts = String(path || '').split('.');
    if (parts[0] === 'header') return { kind: 'header' };
    if (parts[0] === 'sections') {
      var si = parseInt(parts[1], 10);
      if (isNaN(si)) return null;
      if (parts[2] === 'entries') {
        var ei = parseInt(parts[3], 10);
        if (!isNaN(ei)) return { kind: 'entry', si: si, ei: ei };
      }
      return { kind: 'section', si: si };
    }
    return null;
  }

  function renderPreview() {
    var host = $('pages');
    var result = S.layout;
    if (!result) return;
    var z = S.zoom;
    ensureFontFaces(S.doc.theme.fontFamily);
    if (S.doc.theme.headingFamily) ensureFontFaces(S.doc.theme.headingFamily);
    ensurePhotoRender();
    clear(host);
    host.style.display = 'flex';
    host.style.flexDirection = 'column';
    host.style.gap = (24 * z) + 'px';
    host.style.alignItems = 'center';

    result.pages.forEach(function (pg, index) {
      var shell = el('div', { class: 'page-shell' });
      shell.appendChild(el('div', { class: 'page-num', text: 'Page ' + (index + 1) + ' / ' + result.pageCount }));
      shell.appendChild(el('div', { class: 'page-fill', text: Math.round(pg.fill * 100) + ' % rempli' }));
      var page = el('div', {
        class: 'page',
        style: { width: (result.page.width * z) + 'px', height: (result.page.height * z) + 'px' },
      });

      var layer = svg('svg', { viewBox: '0 0 ' + result.page.width + ' ' + result.page.height, preserveAspectRatio: 'none' });
      pg.bg.concat(pg.prims).forEach(function (p) {
        var node = shapeNode(p);
        if (node) layer.appendChild(node);
      });
      page.appendChild(layer);

      pg.prims.forEach(function (p) {
        if (p.t === 'image') {
          if (!S.photoCache.url) return;
          page.appendChild(el('img', {
            class: 'ph', src: S.photoCache.url, alt: '',
            style: { left: (p.x * z) + 'px', top: (p.y * z) + 'px', width: (p.w * z) + 'px', height: (p.h * z) + 'px' },
          }));
          return;
        }
        if (p.t !== 'text' || !p.s) return;
        var size = p.size * z;
        var fm = fontMetrics(p.fam, p.bold, p.italic);
        var top = p.y * z - ((size - (fm.asc + fm.desc) * size) / 2 + fm.asc * size);
        var target = (measureWithTracking(p)) * z;
        var left = p.align === 'right' ? p.x * z - target : p.align === 'center' ? p.x * z - target / 2 : p.x * z;
        var actual = screenWidth(p, size);
        var scaleX = actual > 0 ? Math.max(0.82, Math.min(1.18, target / actual)) : 1;
        var node = el('div', {
          class: 'tx', text: p.s,
          'data-path': p.path || null,
          title: p.path ? 'Double-clic pour éditer' : null,
          style: {
            left: left + 'px', top: top + 'px', fontFamily: cssFamily(p.fam),
            fontSize: size + 'px', fontWeight: p.bold ? '700' : '400', fontStyle: p.italic ? 'italic' : 'normal',
            color: p.color, lineHeight: '1', letterSpacing: p.tr ? (p.tr * z) + 'px' : '0',
            transform: 'scaleX(' + scaleX + ')',
          },
        });
        page.appendChild(node);
      });

      shell.appendChild(page);
      host.appendChild(shell);
    });
  }

  function measureWithTracking(p) {
    var w = E.measureText(p.s, { family: p.fam, size: p.size, bold: p.bold, italic: p.italic });
    return w + (p.tr ? p.tr * Math.max(0, p.s.length - 1) : 0);
  }

  // ── Chemins de champ (« sections.2.entries.0.bullets.1 ») ────────────────
  function getPath(obj, path) {
    var parts = String(path).split('.');
    var cur = obj;
    for (var i = 0; i < parts.length; i++) {
      if (cur === null || cur === undefined) return undefined;
      cur = cur[parts[i]];
    }
    return cur;
  }
  function setPath(obj, path, value) {
    var parts = String(path).split('.');
    var cur = obj;
    for (var i = 0; i < parts.length - 1; i++) {
      if (cur === null || cur === undefined) return false;
      cur = cur[parts[i]];
    }
    if (cur === null || cur === undefined) return false;
    cur[parts[parts.length - 1]] = value;
    return true;
  }

  // ── Édition EN LIGNE dans l'aperçu ───────────────────────────────────────
  //  On n'édite jamais « la ligne » (elle n'existe pas dans le document) mais LE
  //  CHAMP qui l'a produite : la coupure des lignes est recalculée à la validation.
  function startInlineEdit(path, anchor) {
    if (S.editing) commitInlineEdit();
    var value = getPath(S.doc, path);
    if (typeof value !== 'string') return;
    var page = anchor.parentNode;
    var sameField = Array.prototype.filter.call(page.querySelectorAll('.tx'), function (n) {
      return n.getAttribute('data-path') === path;
    });
    var box = null;
    sameField.forEach(function (n) {
      var r = { left: n.offsetLeft, top: n.offsetTop, right: n.offsetLeft + n.offsetWidth, bottom: n.offsetTop + n.offsetHeight };
      box = box ? { left: Math.min(box.left, r.left), top: Math.min(box.top, r.top), right: Math.max(box.right, r.right), bottom: Math.max(box.bottom, r.bottom) } : r;
    });
    if (!box) return;

    var style = window.getComputedStyle(anchor);
    var ta = el('textarea', {
      class: 'edit-overlay',
      style: {
        left: Math.max(0, box.left - 3) + 'px', top: Math.max(0, box.top - 2) + 'px',
        width: Math.max(90, box.right - box.left + 12) + 'px',
        minHeight: (box.bottom - box.top + 6) + 'px',
        fontFamily: style.fontFamily, fontSize: style.fontSize, fontWeight: style.fontWeight,
        fontStyle: style.fontStyle, color: style.color, lineHeight: '1.25',
      },
    });
    ta.value = value;
    sameField.forEach(function (n) { n.style.visibility = 'hidden'; });
    page.appendChild(ta);
    S.editing = { path: path, node: ta, hidden: sameField };
    ta.focus();
    ta.setSelectionRange(value.length, value.length);
    var grow = function () { ta.style.height = 'auto'; ta.style.height = (ta.scrollHeight + 2) + 'px'; };
    grow();
    ta.addEventListener('input', grow);
    ta.addEventListener('blur', commitInlineEdit);
    ta.addEventListener('keydown', function (ev) {
      if (ev.key === 'Escape') { ev.preventDefault(); cancelInlineEdit(); }
      else if (ev.key === 'Enter' && !ev.shiftKey) { ev.preventDefault(); commitInlineEdit(); }
      else if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === 'z') { ev.preventDefault(); }
      ev.stopPropagation();
    });
    ta.addEventListener('paste', function (ev) {
      var text = ev.clipboardData && ev.clipboardData.getData('text/plain');
      if (!text) return;
      ev.preventDefault();
      var cleaned = E.cleanPastedText(text);
      var flat = cleaned.paragraphs.concat(cleaned.bullets).join(' ').trim();
      var start = ta.selectionStart, end = ta.selectionEnd;
      ta.value = ta.value.slice(0, start) + flat + ta.value.slice(end);
      ta.setSelectionRange(start + flat.length, start + flat.length);
      grow();
    });
  }
  function endInlineEdit(apply) {
    var edit = S.editing;
    if (!edit) return;
    S.editing = null;
    var value = edit.node.value;
    if (edit.node.parentNode) edit.node.parentNode.removeChild(edit.node);
    edit.hidden.forEach(function (n) { n.style.visibility = ''; });
    if (apply && setPath(S.doc, edit.path, value)) {
      S.doc = E.migrate(S.doc);
      commit('inline:' + edit.path);
    }
  }
  function commitInlineEdit() { endInlineEdit(true); }
  function cancelInlineEdit() { endInlineEdit(false); renderPreview(); }

  function onPreviewClick(ev) {
    var node = ev.target.closest ? ev.target.closest('.tx[data-path]') : null;
    if (!node) return;
    var path = node.getAttribute('data-path');
    var sel = selectionFromPath(path);
    if (sel) { S.selection = sel; S.tab = 'content'; renderTree(); renderInspector(); }
    Array.prototype.forEach.call(document.querySelectorAll('.tx.hl'), function (n) { n.classList.remove('hl'); });
    Array.prototype.forEach.call(document.querySelectorAll('.tx[data-path="' + path.replace(/"/g, '') + '"]'), function (n) {
      n.classList.add('hl');
    });
  }
  function onPreviewDblClick(ev) {
    var node = ev.target.closest ? ev.target.closest('.tx[data-path]') : null;
    if (!node) return;
    ev.preventDefault();
    startInlineEdit(node.getAttribute('data-path'), node);
  }

  // ══════════════════════════════════════════════════════════════════════════
  //  ARBORESCENCE DES RUBRIQUES (glisser-déposer natif, sans librairie)
  //  Les rubriques se réordonnent, changent de colonne (principale ↔ bandeau)
  //  et les entrées se déplacent d'une rubrique à l'autre.
  // ══════════════════════════════════════════════════════════════════════════

  var drag = null;   // { kind:'section'|'entry', id, si, ei }

  function sectionsOf(col) {
    var out = [];
    S.doc.sections.forEach(function (s, i) { if (s.column === col) out.push({ s: s, i: i }); });
    return out;
  }

  function moveSection(id, col, pos) {
    var from = -1;
    S.doc.sections.forEach(function (s, i) { if (s.id === id) from = i; });
    if (from < 0) return;
    var sec = S.doc.sections.splice(from, 1)[0];
    sec.column = col;
    var list = sectionsOf(col);
    var at = pos >= list.length
      ? (list.length ? list[list.length - 1].i + 1 : S.doc.sections.length)
      : list[pos].i;
    S.doc.sections.splice(at, 0, sec);
    S.selection = { kind: 'section', si: S.doc.sections.indexOf(sec) };
  }

  function moveEntry(fromSi, fromEi, toSi, toPos) {
    var src = S.doc.sections[fromSi];
    var dst = S.doc.sections[toSi];
    if (!src || !dst) return;
    var entry = src.entries.splice(fromEi, 1)[0];
    if (!entry) return;
    if (src === dst && fromEi < toPos) toPos--;
    dst.entries.splice(Math.max(0, Math.min(dst.entries.length, toPos)), 0, entry);
    S.selection = { kind: 'entry', si: toSi, ei: dst.entries.indexOf(entry) };
  }

  /**
   * Déplace une rubrique d'un cran dans SA colonne. Le glisser-déposer n'est pas
   * utilisable au clavier : ces boutons sont le chemin accessible équivalent.
   */
  function nudgeSection(si, delta) {
    var section = S.doc.sections[si];
    if (!section) return;
    var list = sectionsOf(section.column);
    var pos = -1;
    list.forEach(function (item, i) { if (item.i === si) pos = i; });
    var target = pos + delta;
    if (pos < 0 || target < 0 || target >= list.length) return;
    moveSection(section.id, section.column, target);
    commit();
    announce('Rubrique déplacée.');
  }

  function nudgeEntry(si, ei, delta) {
    var section = S.doc.sections[si];
    if (!section || ei + delta < 0 || ei + delta >= section.entries.length) return;
    var entry = section.entries.splice(ei, 1)[0];
    section.entries.splice(ei + delta, 0, entry);
    S.selection = { kind: 'entry', si: si, ei: ei + delta };
    commit();
    announce('Entrée déplacée.');
  }

  /** Index d'insertion déduit de la position du curseur dans une liste. */
  function dropIndex(container, clientY, selector) {
    var items = container.querySelectorAll(selector);
    for (var i = 0; i < items.length; i++) {
      var r = items[i].getBoundingClientRect();
      if (clientY < r.top + r.height / 2) return i;
    }
    return items.length;
  }

  function entryLabel(entry) {
    return entry.title || entry.organisation || (entry.description[0] || '') || (entry.bullets[0] || '');
  }

  function sectionNode(section, globalIndex) {
    var selected = S.selection && S.selection.kind === 'section' && S.selection.si === globalIndex;
    var head = el('div', { class: 'sec-head' }, [
      el('span', { class: 'grip', text: '⠿', 'aria-hidden': 'true' }),
      el('button', {
        class: 'sec-name', text: section.title || 'Rubrique sans titre',
        onclick: function () { S.selection = { kind: 'section', si: globalIndex }; S.tab = 'content'; renderTree(); renderInspector(); },
      }),
      el('button', {
        class: 'btn btn-sm btn-ghost', text: '+', title: 'Ajouter une entrée',
        onclick: function () { addEntry(globalIndex); },
      }),
    ]);
    var meta = el('div', { class: 'sec-meta' }, [
      el('span', { class: 'chip', text: { entries: 'entrées', tags: 'étiquettes', ratings: 'niveaux', list: 'liste', text: 'texte' }[section.layout] || section.layout }),
      el('span', { class: 'chip', text: section.entries.length + ' élément' + (section.entries.length > 1 ? 's' : '') }),
      section.pageBreakBefore ? el('span', { class: 'chip', text: '⤓ saut de page' }) : null,
    ]);

    var entries = el('div', { class: 'entries', 'data-si': globalIndex });
    section.entries.forEach(function (entry, ei) {
      var sel = S.selection && S.selection.kind === 'entry' && S.selection.si === globalIndex && S.selection.ei === ei;
      var label = entryLabel(entry);
      var node = el('div', {
        class: 'ent' + (sel ? ' selected' : ''), draggable: 'true', 'data-ei': ei,
        onclick: function () { S.selection = { kind: 'entry', si: globalIndex, ei: ei }; S.tab = 'content'; renderTree(); renderInspector(); },
        ondragstart: function (ev) {
          drag = { kind: 'entry', si: globalIndex, ei: ei };
          ev.dataTransfer.effectAllowed = 'move';
          try { ev.dataTransfer.setData('text/plain', 'entry'); } catch (_) {}
          node.classList.add('dragging');
          ev.stopPropagation();
        },
        ondragend: function () { drag = null; node.classList.remove('dragging'); renderTree(); },
      }, [
        el('span', { class: 'grip', text: '⠿', 'aria-hidden': 'true' }),
        el('span', { class: 'ent-label' + (label ? '' : ' ent-empty'), text: label || 'Entrée vide' }),
      ]);
      entries.appendChild(node);
    });
    if (!section.entries.length) {
      entries.appendChild(el('div', { class: 'ent ent-empty', text: 'Aucune entrée' }));
    }
    entries.addEventListener('dragover', function (ev) {
      if (!drag || drag.kind !== 'entry') return;
      ev.preventDefault(); ev.stopPropagation();
      entries.classList.add('over');
    });
    entries.addEventListener('dragleave', function () { entries.classList.remove('over'); });
    entries.addEventListener('drop', function (ev) {
      if (!drag || drag.kind !== 'entry') return;
      ev.preventDefault(); ev.stopPropagation();
      entries.classList.remove('over');
      var pos = dropIndex(entries, ev.clientY, '.ent[data-ei]');
      moveEntry(drag.si, drag.ei, globalIndex, pos);
      drag = null;
      commit();
      announce('Entrée déplacée.');
    });

    var node = el('div', {
      class: 'sec' + (selected ? ' selected' : ''), draggable: 'true', 'data-sid': section.id,
      ondragstart: function (ev) {
        if (drag && drag.kind === 'entry') return;
        drag = { kind: 'section', id: section.id };
        ev.dataTransfer.effectAllowed = 'move';
        try { ev.dataTransfer.setData('text/plain', 'section'); } catch (_) {}
        node.classList.add('dragging');
      },
      ondragend: function () { drag = null; node.classList.remove('dragging'); renderTree(); },
    }, [head, meta, entries]);
    return node;
  }

  function columnGroup(col, label) {
    var zone = el('div', { class: 'drop-zone', 'data-col': col });
    sectionsOf(col).forEach(function (item) { zone.appendChild(sectionNode(item.s, item.i)); });
    if (!sectionsOf(col).length) {
      zone.appendChild(el('div', { class: 'empty', text: col === 'side' ? 'Dépose ici une rubrique pour le bandeau latéral.' : 'Aucune rubrique.' }));
    }
    zone.addEventListener('dragover', function (ev) {
      if (!drag || drag.kind !== 'section') return;
      ev.preventDefault();
      zone.classList.add('over');
    });
    zone.addEventListener('dragleave', function () { zone.classList.remove('over'); });
    zone.addEventListener('drop', function (ev) {
      if (!drag || drag.kind !== 'section') return;
      ev.preventDefault();
      zone.classList.remove('over');
      var pos = dropIndex(zone, ev.clientY, '.sec');
      moveSection(drag.id, col, pos);
      drag = null;
      commit();
      announce('Rubrique déplacée dans la colonne ' + (col === 'side' ? 'latérale' : 'principale') + '.');
    });
    return el('div', {}, [el('div', { class: 'col-label', text: label }), zone]);
  }

  function renderTree() {
    var host = clear($('tree'));
    host.appendChild(columnGroup('main', 'Colonne principale'));
    host.appendChild(columnGroup('side', 'Bandeau latéral'));
  }

  // ── Fabriques de champs de formulaire ────────────────────────────────────
  //  `oninput` met à jour le document et l'aperçu SANS reconstruire le panneau
  //  (le focus et le curseur de saisie sont préservés) ; `onchange` rafraîchit
  //  les libellés de l'arborescence.
  function field(label, control, hint) {
    return el('div', { class: 'field' }, [
      label ? el('label', { text: label }) : null,
      control,
      hint ? el('div', { class: 'hint', text: hint }) : null,
    ]);
  }
  function textInput(value, onInput, placeholder) {
    return el('input', {
      type: 'text', value: value || '', placeholder: placeholder || '',
      oninput: function (ev) { onInput(ev.target.value); },
      onchange: function () { renderTree(); },
    });
  }
  function textAreaInput(value, onInput, rows) {
    var ta = el('textarea', {
      rows: rows || 3,
      oninput: function (ev) { onInput(ev.target.value); },
      onchange: function () { renderTree(); },
      onpaste: function (ev) {
        var text = ev.clipboardData && ev.clipboardData.getData('text/plain');
        if (!text || !/[\n•▪]/.test(text)) return;
        ev.preventDefault();
        var cleaned = E.cleanPastedText(text);
        var merged = cleaned.paragraphs.concat(cleaned.bullets.map(function (b) { return '• ' + b; })).join('\n');
        var start = ta.selectionStart, end = ta.selectionEnd;
        ta.value = ta.value.slice(0, start) + merged + ta.value.slice(end);
        onInput(ta.value);
        renderTree();
      },
    });
    ta.value = value || '';
    return ta;
  }
  function selectInput(value, options, onChange) {
    var sel = el('select', { onchange: function (ev) { onChange(ev.target.value); } });
    options.forEach(function (o) {
      var opt = el('option', { value: o.value, text: o.label });
      if (o.value === value) opt.selected = true;
      sel.appendChild(opt);
    });
    return sel;
  }
  function rangeInput(value, min, max, step, onInput, format) {
    var out = el('span', { class: 'val', text: format ? format(value) : String(value) });
    var input = el('input', {
      type: 'range', min: min, max: max, step: step, value: value,
      oninput: function (ev) {
        var v = parseFloat(ev.target.value);
        out.textContent = format ? format(v) : String(v);
        onInput(v);
      },
    });
    return el('div', { class: 'range' }, [input, out]);
  }
  function colorInput(value, onInput) {
    var picker = el('input', { type: 'color', value: value, style: { width: '38px', height: '30px', padding: '0', border: '1px solid var(--line)', borderRadius: '6px' } });
    var hex = el('input', { type: 'text', value: value, style: { flex: '1' } });
    picker.addEventListener('input', function () { hex.value = picker.value; onInput(picker.value); });
    hex.addEventListener('input', function () {

    });
    return el('div', { class: 'row' }, [picker, hex]);

  function toggleInput(label, checked, onChange) {

  /** Sélecteur de police, regroupé par nature (sans serif / serif). */
  function fontSelect(value, onChange, allowInherit) {
    var sel = el('select', { onchange: function (ev) { onChange(ev.target.value); } });
    if (allowInherit) {
      var opt = el('option', { value: '', text: 'Comme le texte' });
      if (!value) opt.selected = true;
      sel.appendChild(opt);
    }
    [['sans', 'Sans serif'], ['serif', 'Avec serif']].forEach(function (group) {
      var box = el('optgroup', { label: group[1] });
      E.FONT_FAMILIES.filter(function (f) { return f.kind === group[0]; }).forEach(function (f) {
        var o = el('option', { value: f.key, text: f.label + (f.builtin ? ' (PDF le plus léger)' : '') });
        if (f.key === value) o.selected = true;

      sel.appendChild(box);

  /** Poids ajouté au PDF par les polices embarquées réellement utilisées. */
  function fontWeightNote() {
    if (!S.layout) return '';
    var used = E.usedFonts(S.layout);
    var ko = 0;
    used.forEach(function (entry) { ko += familyMeta(entry.family).weightKo; });
    if (!ko) return 'Aucun fichier de police embarqué : PDF minimal.';
    return 'Environ +' + ko + ' ko dans le PDF (' + used.length + ' graisse' + (used.length > 1 ? 's' : '') + ' embarquée' + (used.length > 1 ? 's' : '') + ').';
  }

  // ── Mutations du document ────────────────────────────────────────────────
  function addSection(preset) {
    var s = E.normalizeSection({
      title: (preset && preset.title) || 'Nouvelle rubrique',
      column: (preset && preset.column) || 'main',
      layout: (preset && preset.layout) || 'entries',
      entries: [],
    });
    if (s.layout === 'entries' || s.layout === 'text') s.entries.push(E.normalizeEntry({}));
    S.doc.sections.push(s);
    S.selection = { kind: 'section', si: S.doc.sections.length - 1 };
    commit();
    announce('Rubrique ajoutée.');
  }
  function addEntry(si) {
    var s = S.doc.sections[si];
    if (!s) return;
    s.entries.push(E.normalizeEntry(s.layout === 'ratings' ? { rating: 3 } : {}));
    S.selection = { kind: 'entry', si: si, ei: s.entries.length - 1 };
    commit();
  }
  function duplicateSection(si) {
    var s = S.doc.sections[si];
    if (!s) return;
    var copy = E.normalizeSection(JSON.parse(JSON.stringify(s)));
    copy.id = E.newId();
    copy.entries.forEach(function (e) { e.id = E.newId(); });
    copy.title = s.title + ' (copie)';
    S.doc.sections.splice(si + 1, 0, copy);
    S.selection = { kind: 'section', si: si + 1 };
    commit();
  }
  function deleteSection(si) {
    if (!S.doc.sections[si]) return;
    S.doc.sections.splice(si, 1);
    S.selection = null;
    commit();
    announce('Rubrique supprimée.');
  }
  function duplicateEntry(si, ei) {
    var s = S.doc.sections[si];
    if (!s || !s.entries[ei]) return;
    var copy = E.normalizeEntry(JSON.parse(JSON.stringify(s.entries[ei])));
    copy.id = E.newId();
    s.entries.splice(ei + 1, 0, copy);
    S.selection = { kind: 'entry', si: si, ei: ei + 1 };
    commit();
  }
  function deleteEntry(si, ei) {
    var s = S.doc.sections[si];
    if (!s) return;
    s.entries.splice(ei, 1);
    S.selection = { kind: 'section', si: si };
    commit();
  }

  // ── Photo : import, redimensionnement client, recadrage ──────────────────
  //  L'image est réduite à 600 px de côté AVANT stockage et n'est JAMAIS envoyée
  //  automatiquement : elle reste dans le document, sur le poste de l'utilisateur.
  var PHOTO_MAX_PX = 600;
  var PHOTO_MAX_BYTES = 8 * 1024 * 1024;

  function importPhotoFile(file) {
    if (!file) return;
    if (!/^image\/(jpeg|png|webp)$/i.test(file.type)) {
      setStatus('Format d\'image non accepté (JPEG, PNG ou WebP).', 'err');
      return;
    }
    if (file.size > PHOTO_MAX_BYTES) { setStatus('Image trop lourde (8 Mo maximum).', 'err'); return; }
    var reader = new FileReader();
    reader.onload = function () {
      var img = new Image();
      img.onload = function () {
        var scale = Math.min(1, PHOTO_MAX_PX / Math.max(img.width, img.height));
        var canvas = document.createElement('canvas');
        canvas.width = Math.max(1, Math.round(img.width * scale));
        canvas.height = Math.max(1, Math.round(img.height * scale));
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        S.doc.header.photo = E.normalizePhoto({
          dataUrl: canvas.toDataURL('image/jpeg', 0.86),
          shape: (S.doc.header.photo && S.doc.header.photo.shape) || 'rounded',
          zoom: 1, offsetX: 0, offsetY: 0,
        });
        commit();
        setStatus('Photo ajoutée.', 'saved');
      };
      img.onerror = function () { setStatus('Image illisible.', 'err'); };
      img.src = String(reader.result);
    };
    reader.readAsDataURL(file);
  }

  function photoBox() {
    var photo = S.doc.header.photo;
    var drop = el('div', { class: 'photo-drop', title: 'Choisir une photo' });
    if (photo && S.photoCache.url) drop.appendChild(el('img', { src: S.photoCache.url, alt: 'Aperçu de la photo' }));
    else if (photo) drop.appendChild(el('img', { src: photo.dataUrl, alt: 'Aperçu de la photo' }));
    else drop.appendChild(el('span', { text: 'Glisse une photo ici ou clique' }));

    var input = el('input', {
      type: 'file', accept: 'image/jpeg,image/png,image/webp', style: { display: 'none' },
      onchange: function (ev) { importPhotoFile(ev.target.files && ev.target.files[0]); ev.target.value = ''; },
    });
    drop.addEventListener('click', function () { input.click(); });
    drop.addEventListener('dragover', function (ev) { ev.preventDefault(); drop.classList.add('over'); });
    drop.addEventListener('dragleave', function () { drop.classList.remove('over'); });
    drop.addEventListener('drop', function (ev) {
      ev.preventDefault(); drop.classList.remove('over');
      importPhotoFile(ev.dataTransfer.files && ev.dataTransfer.files[0]);
    });

    var controls = el('div', { style: { flex: '1', minWidth: '0' } });
    if (photo) {
      controls.appendChild(field('Forme', selectInput(photo.shape, [
        { value: 'rounded', label: 'Coins arrondis' }, { value: 'circle', label: 'Cercle' }, { value: 'rect', label: 'Rectangle' },
      ], function (v) { photo.shape = v; commit(); })));
      controls.appendChild(field('Zoom', rangeInput(photo.zoom, 1, 4, 0.05, function (v) { photo.zoom = v; commitLight('photoZoom'); }, function (v) { return v.toFixed(2) + '×'; })));
      controls.appendChild(field('Décalage horizontal', rangeInput(photo.offsetX, -1, 1, 0.02, function (v) { photo.offsetX = v; commitLight('photoX'); })));
      controls.appendChild(field('Décalage vertical', rangeInput(photo.offsetY, -1, 1, 0.02, function (v) { photo.offsetY = v; commitLight('photoY'); })));
      controls.appendChild(el('button', {
        class: 'btn btn-sm btn-danger', text: 'Retirer la photo',
        onclick: function () { S.doc.header.photo = null; S.photoCache = { key: '', url: '' }; commit(); },
      }));
    } else {
      controls.appendChild(el('div', { class: 'hint', text: 'Facultative. En France elle est courante sur les CV hospitaliers ; à l\'international, elle est souvent déconseillée.' }));
    }
    return el('div', { class: 'photo-box' }, [drop, input, controls]);
  }

  // ══════════════════════════════════════════════════════════════════════════
  //  BIBLIOTHÈQUE (locale) ET COMPTE (cloud, own-row RLS via /api/cv-docs)
  //  Local d'abord : tout fonctionne SANS COMPTE. Le cloud est un choix explicite.

  function api(path, opts) {
    opts = opts || {};
    opts.headers = Object.assign({ 'Content-Type': 'application/json' }, opts.headers || {});
    if (authToken) opts.headers.Authorization = 'Bearer ' + authToken;
    return fetch(path, opts);
  }
  function refreshAuthUi() {
    var btn = $('btn-review');
    if (btn) btn.title = authToken ? 'Relecture par l\'IA (suggestions à valider)' : 'Connecte-toi pour utiliser la relecture IA';
  }

  var cloudSaveTimer = null;
  var cloudInFlight = false;
  /** Ré-enregistrement automatique — UNIQUEMENT si le CV est déjà sur le compte. */
  function scheduleCloudSave() {
    if (!authToken || !S.serverId) return;
    clearTimeout(cloudSaveTimer);
    cloudSaveTimer = setTimeout(function () { saveCloud(true); }, 2500);
  }
  function saveCloud(silent) {
    if (!authToken) {
      if (!silent) setStatus('Connecte-toi pour enregistrer sur ton compte (sauvegarde locale active).', 'err');
      return Promise.resolve(false);
    }
    if (cloudInFlight) {
      clearTimeout(cloudSaveTimer);
      cloudSaveTimer = setTimeout(function () { saveCloud(silent); }, 900);
      return Promise.resolve(false);
    }
    cloudInFlight = true;
    if (!silent) setStatus('Enregistrement…');
    var body = { id: S.serverId || undefined, title: S.doc.meta.title, theme: 'medical', document: S.doc };
    return api('/api/cv-docs', { method: 'POST', body: JSON.stringify(body) })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        cloudInFlight = false;
        if (!res.ok) { setStatus(res.j.error || 'Enregistrement impossible.', 'err'); return false; }
        S.serverId = res.j.id;
        saveLocal();
        setStatus('Enregistré sur ton compte.', 'saved');
        return true;
      })
      .catch(function () {
        cloudInFlight = false;
        setStatus('Réseau indisponible — le CV reste enregistré sur cet appareil.', 'err');
        return false;
      });
  }

    body.appendChild(el('div', { class: 'divider' }));
    body.appendChild(el('div', { class: 'hint', style: { marginBottom: '8px' }, text: 'Sur ton compte MedInfo :' }));
    var cloudBox = el('div', {});
    body.appendChild(cloudBox);

      cloudBox.appendChild(el('div', { class: 'empty', text: 'Connecte-toi pour retrouver tes CV d\'un appareil à l\'autre.' }));
    } else {
      cloudBox.appendChild(el('div', { class: 'empty', text: 'Chargement…' }));
      api('/api/cv-docs').then(function (r) { return r.json(); }).then(function (j) {
        clear(cloudBox);
        var items = (j && j.items) || [];
        if (!items.length) { cloudBox.appendChild(el('div', { class: 'empty', text: 'Aucun CV enregistré sur ton compte.' })); return; }
        items.forEach(function (item) {
          cloudBox.appendChild(el('div', { class: 'card' }, [
            el('div', { style: { flex: '1' } }, [
              el('div', { class: 't', text: item.title || 'CV sans titre' }),
              el('div', { class: 'd', text: 'modifié le ' + new Date(item.updated_at).toLocaleString('fr-FR') }),
            ]),
            el('button', { class: 'btn btn-sm', text: 'Ouvrir', onclick: function () {
              api('/api/cv-docs?id=' + encodeURIComponent(item.id)).then(function (r) { return r.json(); }).then(function (res) {
                if (!res || !res.cv) { setStatus('Lecture impossible.', 'err'); return; }
                saveLocal();

              }).catch(function () { setStatus('Réseau indisponible.', 'err'); });
            } }),
            el('button', { class: 'btn btn-sm btn-danger', text: '✕', title: 'Supprimer du compte', onclick: function () {
              if (!window.confirm('Supprimer ce CV de ton compte ?')) return;

  // ══════════════════════════════════════════════════════════════════════════
  //  IMPORT D'UN CV EXISTANT (PDF / Word / texte) → pré-remplissage
  //  Le texte est extrait DANS LE NAVIGATEUR ; seul ce texte part vers /api/cv-import.
  // ══════════════════════════════════════════════════════════════════════════
  function extractFileText(file) {
    var name = (file.name || '').toLowerCase();
    if (name.slice(-4) === '.pdf' || file.type === 'application/pdf') {
      return loadScript('/vendor/js/pdf.min.js').then(function () {
        window.pdfjsLib.GlobalWorkerOptions.workerSrc = '/vendor/js/pdf.worker.min.js';
        return file.arrayBuffer();
      }).then(function (buf) {
        return window.pdfjsLib.getDocument({ data: buf }).promise;
      }).then(function (pdf) {
        var jobs = [];
        for (var i = 1; i <= pdf.numPages; i++) jobs.push(pdf.getPage(i).then(function (pg) { return pg.getTextContent(); }));
        return Promise.all(jobs).then(function (contents) {
          return contents.map(function (tc) {
            return tc.items.map(function (it) { return it.str; }).join(' ');
          }).join('\n');
        });
      });
    }
    if (name.slice(-5) === '.docx' || /wordprocessingml/.test(file.type)) {
      return loadScript('/vendor/js/mammoth.browser.min.js')
        .then(function () { return file.arrayBuffer(); })
        .then(function (buf) { return window.mammoth.extractRawText({ arrayBuffer: buf }); })
        .then(function (res) { return res.value || ''; });
    }
    return file.text();
  }

  function openImport() {
    var area = el('textarea', { rows: 8, placeholder: 'Colle ici le texte de ton CV, ou choisis un fichier PDF / Word ci-dessous.' });
    var info = el('div', { class: 'hint', style: { marginTop: '8px' } });
    var input = el('input', {
      type: 'file', accept: '.pdf,.docx,.txt,application/pdf,text/plain',
      onchange: function (ev) {
        var file = ev.target.files && ev.target.files[0];
        if (!file) return;
        info.textContent = 'Lecture du fichier…';
        extractFileText(file).then(function (text) {
          area.value = text.slice(0, 24000);
          info.textContent = 'Texte extrait (' + area.value.length + ' caractères). Vérifie-le puis lance l\'import.';
        }).catch(function () { info.textContent = 'Lecture impossible. Copie-colle le texte à la place.'; });
      },
    });
    var body = el('div', {}, [
      el('p', { class: 'hint', style: { marginBottom: '8px' }, text: 'L\'IA range le texte dans les rubriques du CV. Elle n\'invente rien : ce qui n\'est pas dans le texte reste vide, et tu corriges ensuite.' }),
      input, el('div', { style: { height: '8px' } }), area, info,
    ]);
    var run = el('button', { class: 'btn btn-primary', text: 'Importer' });
    run.addEventListener('click', function () {
      var text = area.value.trim();
      if (text.length < 40) { info.textContent = 'Texte trop court.'; return; }
      if (!authToken) { info.textContent = 'Connecte-toi pour utiliser l\'import assisté par IA.'; return; }
      run.disabled = true;
      info.textContent = 'Analyse en cours…';
      api('/api/cv-import', { method: 'POST', body: JSON.stringify({ text: text }) })
        .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
        .then(function (res) {
          run.disabled = false;
          if (!res.ok) { info.textContent = res.j.error || 'Import impossible.'; return; }
          var imported = E.migrate(res.j.document || res.j);
          imported.theme = S.doc.theme;
          imported.meta.title = imported.header.fullName ? 'CV ' + imported.header.fullName : 'CV importé';
          if (!isDocEmpty() && !window.confirm('Remplacer le CV en cours par le CV importé ?')) return;
          saveLocal();
          closeModal();
          replaceDocument(imported, 'CV importé — vérifie chaque rubrique.');
        })
        .catch(function () { run.disabled = false; info.textContent = 'Réseau indisponible.'; });
    });
    openModal('Importer un CV existant', body, [el('button', { class: 'btn', text: 'Annuler', onclick: closeModal }), run]);
  }

  // ══════════════════════════════════════════════════════════════════════════
  //  RELECTURE IA — des SUGGESTIONS, jamais une réécriture automatique
  //  Le CV envoyé est minimisé : ni photo, ni contacts (données personnelles).
  // ══════════════════════════════════════════════════════════════════════════
  function minimizedDoc() {
    return {
      header: { fullName: S.doc.header.fullName, headline: S.doc.header.headline },
      sections: S.doc.sections.map(function (s) {
        return {
          title: s.title, layout: s.layout,
          entries: s.entries.map(function (e) {
            return { title: e.title, date: e.date, organisation: e.organisation, description: e.description, bullets: e.bullets };
          }),
        };
      }),
    };
  }

  function applySuggestion(sug, node) {
    var current = getPath(S.doc, sug.fieldPath);
    if (typeof current !== 'string') { node.textContent = 'Ce champ n\'existe plus.'; return; }
    if (current.trim() !== String(sug.originalText || '').trim()) {
      node.textContent = 'Le texte a changé depuis la relecture — non appliqué.';
      return;
    }
    setPath(S.doc, sug.fieldPath, sug.suggestedText);
    S.doc = E.migrate(S.doc);
    commit();
    node.textContent = 'Appliqué ✓';
  }

  function openReview() {
    if (!authToken) {
      openModal('Relecture IA', el('div', { class: 'empty', text: 'Connecte-toi avec un compte étudiant ou professionnel vérifié pour utiliser la relecture.' }));
      return;
    }
    var body = el('div', {}, [el('div', { class: 'empty', text: 'Relecture en cours… (quelques secondes)' })]);
    openModal('Relecture IA', body);
    if (S.reviewInFlight) return;
    S.reviewInFlight = true;
    api('/api/cv', { method: 'POST', body: JSON.stringify({ document: minimizedDoc() }) })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        S.reviewInFlight = false;
        clear(body);
        if (!res.ok) { body.appendChild(el('div', { class: 'empty', text: res.j.error || 'Relecture impossible.' })); return; }
        var report = res.j;
        body.appendChild(el('div', { class: 'card' }, [
          el('div', { style: { flex: '1' } }, [
            el('div', { class: 't', text: 'Score global : ' + Math.round(report.globalScore) + '/100' }),
            el('div', { class: 'd', text: report.summary || '' }),
          ]),
        ]));
        body.appendChild(el('div', { class: 'hint', style: { margin: '10px 0' }, text: 'Chaque suggestion est une proposition : rien n\'est modifié tant que tu ne cliques pas sur « Appliquer ».' }));
        (report.blockingIssues || []).forEach(function (issue) {
          body.appendChild(el('div', { class: 'warn' + (issue.severity === 'high' ? ' err' : '') }, [
            el('div', {}, [
              el('div', { style: { fontWeight: '700' }, text: issue.section + ' — ' + issue.message }),
              el('div', { class: 'why', text: issue.suggestedAction }),
            ]),
          ]));
        });
        (report.suggestions || []).forEach(function (sug) {
          var state = el('span', { class: 'why' });
          var card = el('div', { class: 'sugg' }, [
            el('div', { class: 'meta', text: sug.type + ' · ' + sug.severity + ' · ' + sug.section }),
            el('div', { class: 'old', text: sug.originalText }),
            el('div', { class: 'new', text: sug.suggestedText }),
            el('div', { class: 'why', text: sug.explanation }),
            el('div', { class: 'acts' }, [
              el('button', { class: 'btn btn-sm btn-primary', text: 'Appliquer', onclick: function () { applySuggestion(sug, state); } }),
              el('button', { class: 'btn btn-sm', text: 'Ignorer', onclick: function () { card.style.opacity = '.45'; state.textContent = 'Ignorée'; } }),
              state,
            ]),
          ]);
          body.appendChild(card);
        });
        if (!(report.suggestions || []).length) {
          body.appendChild(el('div', { class: 'empty', text: 'Aucune suggestion : le relecteur n\'a rien trouvé à corriger.' }));
        }
      })
      .catch(function () {
        S.reviewInFlight = false;
        clear(body);
        body.appendChild(el('div', { class: 'empty', text: 'Réseau indisponible.' }));
      });
  }

  // ── « Ajuster pour tenir en N pages » ────────────────────────────────────
  function openFit() {
    var current = S.layout ? S.layout.pageCount : 1;
    var target = el('input', { type: 'number', min: 1, max: 6, value: String(Math.max(1, current - 1)), style: { width: '80px' } });
    var out = el('div', { class: 'hint', style: { marginTop: '8px' } });
    var body = el('div', {}, [
      el('p', { text: 'Le CV occupe actuellement ' + current + ' page(s).' }),
      el('div', { class: 'field' }, [el('label', { text: 'Tenir en' }), target]),
      el('p', { class: 'hint', text: 'L\'ajustement resserre d\'abord les espaces, puis l\'interligne, puis le corps du texte et les marges — sans jamais descendre sous des valeurs lisibles. Si ce n\'est pas possible, il le dit.' }),
      out,
    ]);
    var run = el('button', { class: 'btn btn-primary', text: 'Ajuster' });
    run.addEventListener('click', function () {
      var n = Math.max(1, Math.min(6, parseInt(target.value, 10) || 1));
      var result = E.fitToPages(S.doc, n);
      out.textContent = result.message;
      out.style.color = result.ok ? 'var(--success)' : 'var(--danger)';
      if (result.ok && result.changed) {
        S.doc.theme = result.theme;
        commit();
        announce(result.message);
      }
    });
    openModal('Ajuster la mise en page', body, [el('button', { class: 'btn', text: 'Fermer', onclick: closeModal }), run]);
  }

  // ── Sauvegarde / transfert du document JSON ──────────────────────────────
  function downloadBlob(blob, filename) {
    var url = URL.createObjectURL(blob);
    var a = el('a', { href: url, download: filename });
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 2000);
  }
  function exportJson() {
    downloadBlob(new Blob([JSON.stringify(S.doc, null, 2)], { type: 'application/json' }),
      (S.doc.meta.title || 'CV').replace(/[^A-Za-z0-9]+/g, '-') + '.json');
  }
  function importJson() {
    var input = el('input', { type: 'file', accept: 'application/json,.json', style: { display: 'none' } });
    input.addEventListener('change', function () {
      var file = input.files && input.files[0];
      if (!file) return;
      file.text().then(function (text) {
        var parsed;
        try { parsed = JSON.parse(text); } catch (_) { setStatus('Fichier JSON illisible.', 'err'); return; }
        var doc = E.migrate(parsed);
        doc.meta.id = E.newId();
        saveLocal();
        replaceDocument(doc, 'CV importé depuis le fichier.');
      });
    });
    document.body.appendChild(input);
    input.click();
    setTimeout(function () { document.body.removeChild(input); }, 1000);
  }

  // ══════════════════════════════════════════════════════════════════════════
  //  EXPORT PDF VECTORIEL
  // ══════════════════════════════════════════════════════════════════════════
  function whenPhotoReady() {
    if (!S.doc.header.photo) return Promise.resolve();
    ensurePhotoRender();
    if (S.photoCache.url) return Promise.resolve();
    return new Promise(function (resolve) {
      var tries = 0;
      var tick = setInterval(function () {
        tries++;
        if (S.photoCache.url || tries > 40) { clearInterval(tick); resolve(); }
      }, 50);
    });
  }

  /** Convertit un fichier binaire en base64 sans saturer la pile d'appels. */
  function toBase64(buffer) {
    var bytes = new Uint8Array(buffer);
    var chunks = [];
    for (var i = 0; i < bytes.length; i += 8192) {
      chunks.push(String.fromCharCode.apply(null, bytes.subarray(i, i + 8192)));
    }
    return btoa(chunks.join(''));
  }

  var fontDataCache = {};
  /**
   * Récupère les .ttf des couples (famille, style) réellement écrits — et eux seuls.
   * Un échec réseau ne fait PAS échouer l'export : le moteur replie sur une police
   * standard du PDF (le texte reste juste, la police change).
   */
  function loadFontData(entries) {
    return Promise.all(entries.map(function (entry) {
      if (fontDataCache[entry.key]) return Promise.resolve([entry.key, fontDataCache[entry.key]]);
      return fetch('/vendor/fonts/cv/' + entry.file)
        .then(function (r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.arrayBuffer(); })
        .then(function (buf) {
          fontDataCache[entry.key] = toBase64(buf);
          return [entry.key, fontDataCache[entry.key]];
        })
        .catch(function () { return null; });
    })).then(function (pairs) {
      var map = {};
      pairs.forEach(function (pair) { if (pair) map[pair[0]] = pair[1]; });
      return map;
    });
  }

  function exportPdf() {
    var btn = $('btn-pdf');
    btn.disabled = true;
    var label = btn.innerHTML;
    btn.textContent = 'Génération…';
    setStatus('Génération du PDF…');
    var result = E.layout(S.doc);
    Promise.all([loadJsPdf(), whenPhotoReady(), loadFontData(E.usedFonts(result))])
      .then(function (res) {
        var ctor = res[0];
        var fonts = res[2];
        var images = {};
        var photo = S.doc.header.photo;
        if (photo && S.photoCache.url) images[photo.dataUrl] = { dataUrl: S.photoCache.url, format: 'JPEG' };
        var pdf = E.renderPdf(result, ctor, { images: images, fonts: fonts, title: S.doc.meta.title });
        pdf.save(E.pdfFileName(S.doc));
        setStatus('PDF téléchargé (' + result.pageCount + ' page(s), texte sélectionnable).', 'saved');
      })
      .catch(function (err) {
        console.error('Export PDF', err);
        setStatus('Échec de la génération du PDF.', 'err');
      })
      .then(function () { btn.disabled = false; btn.innerHTML = label; });
  }

  // ── Avertissements au-dessus de l'aperçu ─────────────────────────────────
  function renderWarnings() {
    var host = clear($('warnings'));
    if (!S.layout) return;
    var items = S.layout.warnings.slice();
    var unsupported = E.unsupportedCharacters(S.doc);
    if (unsupported.length) {
      items.push({
        code: 'charset',
        message: 'Caractères non disponibles dans les polices PDF standard : ' + unsupported.join(' ') + '.',
        hint: 'Ils seront remplacés par « ? » dans le PDF. Remplace-les par leur équivalent latin.',
      });
    }
    var failing = E.contrastReport(S.doc).filter(function (c) { return !c.ok; });
    if (failing.length) {
      items.push({
        code: 'contrast',
        message: 'Contraste insuffisant : ' + failing[0].label.toLowerCase() + ' (' + failing[0].ratio.toFixed(2) + ':1, minimum 4,5:1).',
        hint: 'Onglet Thème : fonce la couleur concernée. Un accent trop clair devient illisible à l\'impression.',
      });
    }
    items.forEach(function (w) {
      host.appendChild(el('div', { class: 'warn' + (w.code === 'oversize' || w.code === 'contrast' ? ' err' : '') }, [
        el('div', {}, [
          el('div', { style: { fontWeight: '700' }, text: w.message }),
          w.hint ? el('div', { text: w.hint }) : null,
        ]),
      ]));
    });
  }

  // ── Boucle de rendu ──────────────────────────────────────────────────────
  function updateTopbar() {
    $('pages-badge').textContent = S.layout ? S.layout.pageCount + (S.layout.pageCount > 1 ? ' pages' : ' page') : '—';
    $('zoom-val').textContent = Math.round(S.zoom * 100) + ' %';
    $('btn-undo').disabled = S.hIndex <= 0;
    $('btn-redo').disabled = S.hIndex >= S.history.length - 1;
    if ($('doc-title').value !== S.doc.meta.title) $('doc-title').value = S.doc.meta.title;
  }

  function relayout() {
    S.layout = E.layout(S.doc);
    renderPreview();
    renderWarnings();
    updateTopbar();
    announce(S.layout.pageCount + ' page' + (S.layout.pageCount > 1 ? 's' : '') + '.');
  }
  var relayoutSoon = debounce(relayout, 150);

  function renderAll() {
    // La mise en page D'ABORD : l'inspecteur en lit des chiffres (poids des polices
    // embarquées) et afficherait sinon ceux du rendu précédent.
    relayout();
    renderTree();
    renderInspector();
  }
  /** Modification depuis un champ du formulaire : on ne reconstruit PAS le panneau. */
  function commitLight(key) {
    pushHistory(key);
    saveLocal();
    scheduleCloudSave();
    relayoutSoon();
    updateTopbar();
  }

  // ── Zoom ─────────────────────────────────────────────────────────────────
  /**
   * Zoom « au plus juste ». Sur mobile l'aperçu est masqué au démarrage
   * (clientWidth = 0) : on retombe alors sur la largeur de la fenêtre, sinon la
   * page A4 sortirait de l'écran sans moyen de la faire défiler.
   */
  function fitZoom() {
    var pane = document.querySelector('.pane-center');
    var width = pane && pane.clientWidth ? pane.clientWidth : window.innerWidth;
    return Math.max(0.35, Math.min(1.5, (width - 44) / E.A4.w));
  }
  function setZoom(z, auto) {
    S.zoomAuto = auto === true;
    S.zoom = Math.max(0.35, Math.min(1.5, Math.round(z * 100) / 100));
    renderPreview();
    updateTopbar();
  }

  // ── Menu « autres actions » ──────────────────────────────────────────────
  function toggleMenu() {
    var existing = document.querySelector('.menu');
    if (existing) { existing.parentNode.removeChild(existing); return; }
    var menu = el('div', { class: 'menu' }, [
      el('button', { text: 'Modèles de CV…', onclick: function () { closeMenu(); openTemplates(); } }),
      el('button', { text: 'Mes CV…', onclick: function () { closeMenu(); openLibrary(); } }),
      el('button', { text: 'Importer un CV existant (PDF, Word)…', onclick: function () { closeMenu(); openImport(); } }),
      el('button', { text: 'Ajuster la mise en page…', onclick: function () { closeMenu(); openFit(); } }),
      el('div', { class: 'sep' }),
      el('button', { text: 'Enregistrer sur mon compte', onclick: function () { closeMenu(); saveCloud(false); } }),
      el('button', { text: 'Télécharger le document (.json)', onclick: function () { closeMenu(); exportJson(); } }),
      el('button', { text: 'Ouvrir un document (.json)…', onclick: function () { closeMenu(); importJson(); } }),
    ]);
    document.body.appendChild(menu);
    setTimeout(function () { document.addEventListener('click', outsideMenu); }, 0);
  }
  function closeMenu() {
    var menu = document.querySelector('.menu');
    if (menu) menu.parentNode.removeChild(menu);
    document.removeEventListener('click', outsideMenu);
  }
  function outsideMenu(ev) {
    if (ev.target.closest && ev.target.closest('.menu')) return;
    closeMenu();
  }

  // ── Amorçage ─────────────────────────────────────────────────────────────
  function bootstrap() {
    var index = readIndex();
    var loaded = index.length ? loadLocal(index[0].id) : null;
    if (!loaded) loaded = importLegacyDraft();
    if (loaded) {
      S.doc = loaded.doc;
      S.serverId = loaded.serverId;
    } else {
      S.doc = E.buildTemplate('etudiant-fr');
    }
    pushHistory('');
    saveLocal();
    setZoomInitial();
    renderAll();
    if (!loaded) setStatus('Modèle « CV étudiant en médecine » chargé — menu ⋯ pour en changer.');
  }

  function setZoomInitial() {
    S.zoom = fitZoom();
    S.zoomAuto = true;
  }

  function wire() {
    $('doc-title').addEventListener('input', function (ev) {
      S.doc.meta.title = ev.target.value;
      commitLight('title');
    });
    $('btn-undo').addEventListener('click', undo);
    $('btn-redo').addEventListener('click', redo);
    $('zoom-in').addEventListener('click', function () { setZoom(S.zoom + 0.1); });
    $('zoom-out').addEventListener('click', function () { setZoom(S.zoom - 0.1); });
    $('zoom-val').addEventListener('click', function () { setZoom(fitZoom(), true); });
    $('btn-fit').addEventListener('click', openFit);
    $('btn-pdf').addEventListener('click', exportPdf);
    $('btn-review').addEventListener('click', openReview);
    $('btn-menu').addEventListener('click', function (ev) { ev.stopPropagation(); toggleMenu(); });
    $('btn-add-section').addEventListener('click', function () { addSection(null); });
    $('btn-header').addEventListener('click', function () {
      S.selection = { kind: 'header' }; S.tab = 'content'; renderTree(); renderInspector();
    });
    $('itab-content').addEventListener('click', function () { S.tab = 'content'; renderInspector(); });
    $('itab-theme').addEventListener('click', function () { S.tab = 'theme'; renderInspector(); });

    var center = document.querySelector('.pane-center');
    center.addEventListener('click', onPreviewClick);
    center.addEventListener('dblclick', onPreviewDblClick);

    $('tab-edit').addEventListener('click', function () {
      document.body.className = 'm-edit';
      $('tab-edit').setAttribute('aria-selected', 'true');
      $('tab-preview').setAttribute('aria-selected', 'false');
    });
    $('tab-preview').addEventListener('click', function () {
      document.body.className = 'm-preview';
      $('tab-edit').setAttribute('aria-selected', 'false');
      $('tab-preview').setAttribute('aria-selected', 'true');
      // L'aperçu vient d'apparaître : sa largeur n'était pas mesurable avant.
      if (S.zoomAuto) setZoom(fitZoom(), true); else renderPreview();
    });

    document.addEventListener('keydown', function (ev) {
      var mod = ev.ctrlKey || ev.metaKey;
      if (!mod) return;
      var key = ev.key.toLowerCase();
      if (key === 'z' && !ev.shiftKey) { ev.preventDefault(); undo(); }
      else if ((key === 'z' && ev.shiftKey) || key === 'y') { ev.preventDefault(); redo(); }
      else if (key === 's') { ev.preventDefault(); saveCloud(false); }
    });

    window.addEventListener('resize', debounce(function () {
      if (S.zoomAuto) setZoom(fitZoom(), true); else renderPreview();
    }, 200));
    // Filet anti-perte : dernière écriture locale avant de quitter la page.
    window.addEventListener('pagehide', function () { saveLocal(); });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function () { wire(); bootstrap(); refreshAuthUi(); });
  } else { wire(); bootstrap(); refreshAuthUi(); }
})();
</script>
</body>
</html>
