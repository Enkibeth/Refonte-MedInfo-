<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Créateur de CV — MedInfo</title>
<link rel="stylesheet" href="/vendor/fonts/fonts.css" />
<!--
  Créateur de CV — page autonome (traitement 100 % client).

  • Le CONTENU du CV ne quitte jamais le poste, sauf action explicite :
    « Enregistrer sur mon compte » (/api/cv-docs, RLS own-row) ou « Relecture IA »
    (/api/cv, CV minimisé : ni photo, ni coordonnées).
  • L'export PDF est VECTORIEL (texte réel sélectionnable) : il est produit par le
    moteur de mise en page + l'API texte de jsPDF. Aucune capture d'écran — un CV
    exporté en image n'est pas lisible par les logiciels de tri (ATS) des CHU.
  • Aucune ressource externe : polices et librairies sont servies par le domaine.
    jsPDF, pdf.js et mammoth sont chargés À LA DEMANDE (rien au premier rendu).
-->
<style>
  :root {
    --accent: #2563eb; --accent-deep: #1e40af; --accent-soft: #eef4ff; --accent-tint: #d9e6ff;
    --vivid: #0067ff; --vivid-deep: #0052d6;
    --ink: #0e1626; --ink2: #36435a; --muted: #5d6b80;
    --surface: #ffffff; --bg: #f7f9fc; --bg2: #eef2f8;
    --line: #dde3ed; --line-fine: #eaeef5;
    --danger: #c42233; --danger-soft: #fbeaec; --success: #157f50; --warn: #9a5b00; --warn-soft: #fff4e0;
    --radius: 12px; --radius-sm: 8px;
    --topbar-h: 52px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    font-family: 'Public Sans', system-ui, -apple-system, sans-serif;
    color: var(--ink); background: var(--bg); font-size: 13.5px; line-height: 1.45;
    overflow: hidden;
  }
  h1, h2, h3, p { margin: 0; }
  button, input, select, textarea { font-family: inherit; font-size: inherit; color: inherit; }
  button { cursor: pointer; }
  :focus-visible { outline: 2px solid var(--vivid); outline-offset: 1px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* ── Barre supérieure ─────────────────────────────────────────────────── */
  .topbar {
    height: var(--topbar-h); display: flex; align-items: center; gap: 8px;
    padding: 0 12px; background: var(--surface); border-bottom: 1px solid var(--line);
  }
  .topbar .grow { flex: 1 1 auto; min-width: 8px; }
  .doc-title {
    border: 1px solid transparent; border-radius: var(--radius-sm); padding: 5px 8px;
    font-weight: 600; font-size: 14px; min-width: 120px; max-width: 260px; background: transparent;
  }
  .doc-title:hover { border-color: var(--line); }
  .doc-title:focus { border-color: var(--accent); background: var(--surface); outline: none; }
  .status { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .status.saved { color: var(--success); }
  .status.err { color: var(--danger); }

  .btn {
    display: inline-flex; align-items: center; gap: 6px; padding: 6px 11px;
    border-radius: var(--radius-sm); border: 1px solid var(--line); background: var(--surface);
    color: var(--ink2); font-size: 12.5px; font-weight: 600; white-space: nowrap;
  }
  .btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-primary { background: var(--vivid); border-color: var(--vivid); color: #fff; }
  .btn-primary:hover:not(:disabled) { background: var(--vivid-deep); border-color: var(--vivid-deep); color: #fff; }
  .btn-ghost { border-color: transparent; background: transparent; }
  .btn-icon { padding: 6px 8px; font-size: 14px; line-height: 1; }
  .btn-sm { padding: 4px 8px; font-size: 12px; }
  .btn-danger:hover:not(:disabled) { border-color: var(--danger); color: var(--danger); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius-sm); overflow: hidden; }
  .seg button { border: none; background: var(--surface); padding: 6px 9px; font-size: 12px; font-weight: 600; color: var(--ink2); }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-deep); }
  .badge { font-size: 11.5px; font-weight: 700; color: var(--ink2); background: var(--bg2); border-radius: 999px; padding: 3px 9px; white-space: nowrap; }

  /* ── Trois colonnes ───────────────────────────────────────────────────── */
  .layout { display: grid; grid-template-columns: 268px 1fr 320px; height: calc(100% - var(--topbar-h)); }
  .pane { overflow-y: auto; background: var(--surface); }
  .pane-left { border-right: 1px solid var(--line); }
  .pane-right { border-left: 1px solid var(--line); }
  .pane-center { background: var(--bg2); overflow: auto; position: relative; }
  .pane-head {
    position: sticky; top: 0; z-index: 3; background: var(--surface); border-bottom: 1px solid var(--line-fine);
    padding: 9px 12px; display: flex; align-items: center; gap: 6px;
  }
  .pane-head h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 700; }
  .pane-body { padding: 10px 12px 40px; }

  /* ── Arborescence des rubriques ───────────────────────────────────────── */
  .col-label {
    font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em;
    color: var(--muted); margin: 12px 0 5px; display: flex; align-items: center; gap: 6px;
  }
  .col-label::after { content: ''; flex: 1; height: 1px; background: var(--line-fine); }
  .drop-zone { min-height: 14px; border-radius: 6px; }
  .drop-zone.over { background: var(--accent-soft); outline: 1px dashed var(--accent); }
  .sec {
    border: 1px solid var(--line); border-radius: var(--radius-sm); margin-bottom: 6px; background: var(--surface);
  }
  .sec.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .sec.dragging { opacity: .4; }
  .sec-head { display: flex; align-items: center; gap: 4px; padding: 6px 6px 6px 4px; }
  .grip { cursor: grab; color: #9aa6b6; padding: 2px 3px; font-size: 13px; line-height: 1; user-select: none; }
  .grip:active { cursor: grabbing; }
  .sec-name { flex: 1; font-weight: 600; font-size: 12.8px; text-align: left; background: none; border: none; padding: 3px 2px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sec-meta { font-size: 10.5px; color: var(--muted); padding: 0 8px 6px 26px; display: flex; gap: 6px; flex-wrap: wrap; }
  .chip { background: var(--bg2); border-radius: 999px; padding: 1px 7px; font-size: 10.5px; }
  .entries { padding: 0 6px 6px 20px; }
  .ent {
    display: flex; align-items: center; gap: 4px; padding: 4px 6px; border-radius: 6px;
    font-size: 12px; color: var(--ink2); border: 1px solid transparent; cursor: pointer;
  }
  .ent:hover { background: var(--bg); }
  .ent.selected { background: var(--accent-soft); border-color: var(--accent-tint); color: var(--accent-deep); }
  .ent.dragging { opacity: .4; }
  .ent-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left; background: none; border: none; padding: 0; }
  .ent-empty { color: var(--muted); font-style: italic; }
  .drop-line { height: 2px; background: var(--vivid); border-radius: 2px; margin: 1px 0; }

  /* ── Aperçu A4 ────────────────────────────────────────────────────────── */
  .preview-wrap { padding: 18px 18px 60px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
  .page-shell { position: relative; }
  .page {
    position: relative; background: #fff; box-shadow: 0 2px 14px rgba(16,30,54,.14);
    overflow: hidden; transform-origin: top center;
  }
  .page-num { position: absolute; left: 0; top: -15px; font-size: 11px; color: var(--muted); }
  .page-fill { position: absolute; right: 0; top: -15px; font-size: 11px; color: var(--muted); }
  .page svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .tx {
    position: absolute; white-space: pre; transform-origin: left top; cursor: text;
    border-radius: 2px;
  }
  .tx[data-path]:hover { background: rgba(0,103,255,.10); }
  .tx.hl { background: rgba(0,103,255,.16); }
  .ph { position: absolute; }
  .edit-overlay {
    position: absolute; z-index: 5; border: 1px solid var(--vivid); border-radius: 3px;
    background: #fff; box-shadow: 0 3px 14px rgba(16,30,54,.2); padding: 2px 3px; resize: none;
    white-space: pre-wrap; overflow: hidden; line-height: inherit;
  }
  .warnbar {
    max-width: 780px; width: 100%; display: flex; flex-direction: column; gap: 6px;
  }
  .warn {
    background: var(--warn-soft); border: 1px solid #f0d9ac; color: #6d4200; border-radius: var(--radius-sm);
    padding: 8px 11px; font-size: 12.5px; display: flex; gap: 8px; align-items: flex-start;
  }
  .warn.err { background: var(--danger-soft); border-color: #f0c2c8; color: #8c1626; }
  .warn button { margin-left: auto; }

  /* ── Inspecteur ───────────────────────────────────────────────────────── */
  .tabs { display: flex; gap: 4px; }
  .tabs button {
    border: none; background: none; padding: 5px 9px; border-radius: 999px; font-size: 12px; font-weight: 700; color: var(--muted);
  }
  .tabs button[aria-selected="true"] { background: var(--accent-soft); color: var(--accent-deep); }
  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 3px; }
  .field input[type="text"], .field textarea, .field select, .field input[type="number"] {
    width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface);
  }
  .field textarea { resize: vertical; min-height: 60px; line-height: 1.4; }
  .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--accent); outline: none; }
  .field .hint { font-size: 11px; color: var(--muted); margin-top: 3px; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; min-width: 0; }
  .list-item { display: flex; gap: 6px; align-items: flex-start; margin-bottom: 6px; }
  .list-item textarea, .list-item input { flex: 1; }
  .range { display: flex; align-items: center; gap: 8px; }
  .range input[type="range"] { flex: 1; }
  .range .val { font-size: 11.5px; color: var(--muted); width: 46px; text-align: right; font-variant-numeric: tabular-nums; }
  .swatches { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
  .swatch { width: 26px; height: 26px; border-radius: 50%; border: 2px solid transparent; cursor: pointer; }
  .swatch[aria-pressed="true"] { border-color: var(--ink); }
  .contrast { font-size: 11.5px; margin-top: 6px; }
  .contrast div { display: flex; justify-content: space-between; gap: 8px; padding: 2px 0; }
  .contrast .ko { color: var(--danger); font-weight: 700; }
  .empty { color: var(--muted); font-size: 12.5px; padding: 18px 6px; text-align: center; }
  .divider { height: 1px; background: var(--line-fine); margin: 12px 0; }
  .photo-box { display: flex; gap: 10px; align-items: flex-start; }
  .photo-drop {
    width: 92px; height: 92px; border: 1px dashed var(--line); border-radius: 8px; display: flex;
    align-items: center; justify-content: center; overflow: hidden; background: var(--bg); flex: none;
    font-size: 11px; color: var(--muted); text-align: center; padding: 6px; cursor: pointer; position: relative;
  }
  .photo-drop.over { border-color: var(--vivid); background: var(--accent-soft); }
  .photo-drop img { width: 100%; height: 100%; object-fit: cover; }

  /* ── Modales ──────────────────────────────────────────────────────────── */
  .backdrop {
    position: fixed; inset: 0; background: rgba(14,22,38,.5); display: flex; align-items: center;
    justify-content: center; padding: 20px; z-index: 40;
  }
  .modal {
    background: var(--surface); border-radius: var(--radius); width: 100%; max-width: 620px;
    max-height: 86vh; display: flex; flex-direction: column; box-shadow: 0 18px 50px rgba(14,22,38,.28);
  }
  .modal-head { padding: 14px 16px; border-bottom: 1px solid var(--line); display: flex; align-items: center; gap: 8px; }
  .modal-head h3 { font-size: 15px; font-weight: 700; flex: 1; }
  .modal-body { padding: 14px 16px; overflow-y: auto; }
  .modal-foot { padding: 12px 16px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; }
  .card {
    border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 10px 12px; margin-bottom: 8px;
    display: flex; gap: 10px; align-items: center; text-align: left; width: 100%; background: var(--surface);
  }
  .card:hover { border-color: var(--accent); }
  .card .t { font-weight: 700; font-size: 13px; }
  .card .d { font-size: 11.5px; color: var(--muted); }
  .menu {
    position: absolute; right: 10px; top: calc(var(--topbar-h) - 4px); background: var(--surface);
    border: 1px solid var(--line); border-radius: var(--radius-sm); box-shadow: 0 10px 28px rgba(14,22,38,.16);
    padding: 5px; z-index: 30; min-width: 232px;
  }
  .menu button {
    display: block; width: 100%; text-align: left; border: none; background: none; padding: 7px 10px;
    border-radius: 6px; font-size: 12.5px; color: var(--ink2);
  }
  .menu button:hover { background: var(--bg); color: var(--accent); }
  .menu .sep { height: 1px; background: var(--line-fine); margin: 4px 2px; }
  .sugg { border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 9px 11px; margin-bottom: 8px; }
  .sugg .meta { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em; font-weight: 700; }
  .sugg .old { color: var(--danger); text-decoration: line-through; font-size: 12.5px; margin: 4px 0; }
  .sugg .new { color: var(--success); font-size: 12.5px; margin: 4px 0; }
  .sugg .why { font-size: 11.5px; color: var(--muted); }
  .sugg .acts { display: flex; gap: 6px; margin-top: 7px; }

  /* ── Mobile / tablette ────────────────────────────────────────────────── */
  .lbl-short { display: none; }
  .mobile-tabs { display: none; }
  @media (max-width: 1023px) {
    /* La barre ne défile pas (body en overflow:hidden) : tout ce qui ne tient pas
       serait INATTEIGNABLE. Les réglages secondaires passent dans le menu « ⋯ ». */
    .topbar { padding: 0 8px; gap: 5px; }
    .topbar .seg, #pages-badge, #btn-fit { display: none; }
    .status { max-width: 90px; overflow: hidden; text-overflow: ellipsis; }
    .lbl-full { display: none; }
    .lbl-short { display: inline; }
    .layout { grid-template-columns: 1fr; }
    .pane-left, .pane-right, .pane-center { display: none; }
    body.m-edit .pane-left, body.m-edit .pane-right { display: block; }
    body.m-edit .layout { grid-template-rows: auto 1fr; }
    body.m-preview .pane-center { display: block; }
    .mobile-tabs {
      display: flex; gap: 6px; padding: 6px 10px; background: var(--surface); border-bottom: 1px solid var(--line);
    }
    .mobile-tabs button { flex: 1; }
    .layout { height: calc(100% - var(--topbar-h) - 41px); }
    .doc-title { max-width: 120px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body class="m-edit">

<header class="topbar">
  <input id="doc-title" class="doc-title" aria-label="Titre du CV" value="Mon CV" />
  <span id="status" class="status" role="status" aria-live="polite"></span>
  <span class="grow"></span>

  <button id="btn-undo" class="btn btn-icon btn-ghost" title="Annuler (Ctrl+Z)" aria-label="Annuler">↶</button>
  <button id="btn-redo" class="btn btn-icon btn-ghost" title="Rétablir (Ctrl+Maj+Z)" aria-label="Rétablir">↷</button>

  <span class="seg" role="group" aria-label="Zoom de l'aperçu">
    <button id="zoom-out" aria-label="Réduire le zoom">−</button>
    <button id="zoom-val" aria-label="Zoom" title="Réinitialiser le zoom">100 %</button>
    <button id="zoom-in" aria-label="Augmenter le zoom">+</button>
  </span>
  <span id="pages-badge" class="badge" aria-live="polite">1 page</span>
  <button id="btn-fit" class="btn btn-sm" title="Resserrer la mise en page pour tenir en moins de pages">Ajuster…</button>

  <button id="btn-review" class="btn"><span class="lbl-full">Relecture IA</span><span class="lbl-short">IA</span></button>
  <button id="btn-pdf" class="btn btn-primary"><span class="lbl-full">Télécharger le PDF</span><span class="lbl-short">PDF</span></button>
  <button id="btn-menu" class="btn btn-icon" aria-haspopup="true" aria-expanded="false" aria-label="Autres actions">⋯</button>
</header>

<div class="mobile-tabs" role="tablist">
  <button id="tab-edit" class="btn" role="tab" aria-selected="true">Édition</button>
  <button id="tab-preview" class="btn" role="tab" aria-selected="false">Aperçu</button>
</div>

<div class="layout">
  <!-- ── Colonne 1 : arborescence des rubriques ─────────────────────────── -->
  <aside class="pane pane-left" aria-label="Rubriques du CV">
    <div class="pane-head">
      <h2>Rubriques</h2>
      <span class="grow"></span>
      <button id="btn-add-section" class="btn btn-sm">+ Rubrique</button>
    </div>
    <div class="pane-body">
      <button id="btn-header" class="card" style="margin-bottom:10px">
        <span class="t" style="flex:1">En-tête &amp; contacts</span>
        <span class="d">Nom, accroche, photo</span>
      </button>
      <div id="tree"></div>
    </div>
  </aside>

  <!-- ── Colonne 2 : aperçu A4 ──────────────────────────────────────────── -->
  <main class="pane-center" aria-label="Aperçu du CV">
    <div class="preview-wrap">
      <div id="warnings" class="warnbar"></div>
      <div id="pages"></div>
    </div>
  </main>

  <!-- ── Colonne 3 : inspecteur ─────────────────────────────────────────── -->
  <aside class="pane pane-right" aria-label="Inspecteur">
    <div class="pane-head">
      <div class="tabs" role="tablist">
        <button id="itab-content" role="tab" aria-selected="true">Contenu</button>
        <button id="itab-theme" role="tab" aria-selected="false">Thème</button>
      </div>
    </div>
    <div id="inspector" class="pane-body"></div>
  </aside>
</div>

<div id="overlays"></div>
<span id="live" class="sr" role="status" aria-live="polite"></span>
<script>
/* @cv-engine:start ────────────────────────────────────────────────────────────
   MOTEUR PUR du créateur de CV (aucun DOM, aucun réseau).

   Il produit, à partir du document JSON, une LISTE DE PRIMITIVES DE DESSIN
   positionnées au point PostScript près. Ces mêmes primitives alimentent :
     • l'aperçu A4 à l'écran (rendu DOM/SVG) ;
     • l'export PDF VECTORIEL (jsPDF, texte réel sélectionnable et extractible).
   → l'aperçu ne peut pas mentir sur la pagination : c'est le même calcul.

   Les largeurs de glyphes viennent des polices PDF standard (base 14) telles que
   jsPDF les déclare dans le fichier (/Widths) — cf.
   scripts/dev/extract-pdf-font-metrics.cjs. Mesurer avec CES chiffres est ce qui
   garantit que la coupure des lignes et le nombre de pages à l'écran sont
   exactement ceux du PDF téléchargé.

   Testé hors navigateur : tests/unit/helpers/cvEngine.ts extrait ce bloc et
   l'exécute dans un contexte `vm` (même patron que public/partiel.html).
   ────────────────────────────────────────────────────────────────────────── */
(function (root) {
  'use strict';

  // ── Géométrie A4 (points PostScript, unité native du PDF) ────────────────
  var PT_PER_MM = 72 / 25.4;
  var A4 = { w: 595.28, h: 841.89 };

  var SCHEMA_VERSION = 2;
  var FONT_METRICS = {
    helvetica: {

    if (opts && opts.path) p.path = opts.path;
    if (opts && opts.link) p.link = opts.link;
    return p;
  }

  /** Hauteur d'une ligne de texte et position de sa ligne de base dans cette hauteur. */
  function lineBox(size, lineHeight) {

    return { h: h, baseline: (h - size) / 2 + size * 0.78 };
  }

  /**
   * Bloc « paragraphe » : un texte coupé en lignes, avec soulignement optionnel
   * d'un fragment (le fragment peut s'étaler sur plusieurs lignes).
   */
  function paragraphBlock(text, font, color, width, lineHeight, opts) {
    opts = opts || {};
    var lines = wrapText(text, font, width);
    var lb = lineBox(font.size, lineHeight);
    var prims = [];
    var underlineRange = null;
    if (opts.underline) {
      var at = text.indexOf(opts.underline);
      if (at >= 0) underlineRange = [at, at + opts.underline.length];
    }
    for (var i = 0; i < lines.length; i++) {
      var y = i * lb.h;
      var x = 0;
      if (opts.align === 'right') x = width - measureText(lines[i].text, font);
      else if (opts.align === 'center') x = (width - measureText(lines[i].text, font)) / 2;

      }));

    } else if (kind === 'location') {

      p.push({ t: 'circle', cx: x + s * 0.5, cy: y + s * 0.42, r: s * 0.34, fill: color });
      p.push({ t: 'circle', cx: x + s * 0.5, cy: y + s * 0.42, r: s * 0.13, fill: '#ffffff' });
    } else if (kind === 'home') {
      p.push({ t: 'poly', pts: [[x + s * 0.5, y + s * 0.08], [x + s * 0.98, y + s * 0.5], [x + s * 0.02, y + s * 0.5]], fill: color, close: true });
      p.push({ t: 'rect', x: x + s * 0.16, y: y + s * 0.48, w: s * 0.68, h: s * 0.44, fill: color });
      p.push({ t: 'rect', x: x + s * 0.42, y: y + s * 0.64, w: s * 0.16, h: s * 0.28, fill: '#ffffff' });

    } else if (kind === 'flag') {

      p.push({ t: 'poly', pts: [[x + s * 0.2, y + s * 0.12], [x + s * 0.9, y + s * 0.12], [x + s * 0.72, y + s * 0.34], [x + s * 0.9, y + s * 0.56], [x + s * 0.2, y + s * 0.56]], fill: color, close: true });
    } else if (kind === 'globe') {

      p.push({ t: 'rect', x: x + s * 0.18, y: y + s * 0.38, w: s * 0.14, h: s * 0.38, fill: '#ffffff' });
      p.push({ t: 'circle', cx: x + s * 0.25, cy: y + s * 0.26, r: s * 0.08, fill: '#ffffff' });
      p.push({ t: 'rect', x: x + s * 0.42, y: y + s * 0.38, w: s * 0.14, h: s * 0.38, fill: '#ffffff' });
      p.push({ t: 'rect', x: x + s * 0.56, y: y + s * 0.38, w: s * 0.26, h: s * 0.14, fill: '#ffffff' });
      p.push({ t: 'rect', x: x + s * 0.68, y: y + s * 0.44, w: s * 0.14, h: s * 0.32, fill: '#ffffff' });
    } else if (kind === 'calendar') {
      p.push({ t: 'rect', x: x, y: y + s * 0.15, w: s, h: s * 0.8, fill: color, r: s * 0.08 });
      p.push({ t: 'rect', x: x + s * 0.08, y: y + s * 0.42, w: s * 0.84, h: s * 0.45, fill: '#ffffff' });
      p.push({ t: 'rect', x: x + s * 0.22, y: y + s * 0.04, w: s * 0.12, h: s * 0.2, fill: color });
      p.push({ t: 'rect', x: x + s * 0.66, y: y + s * 0.04, w: s * 0.12, h: s * 0.2, fill: color });
    } else {
      p.push({ t: 'circle', cx: x + s * 0.5, cy: y + s * 0.5, r: s * 0.46, fill: color });
      p.push({ t: 'rect', x: x + s * 0.44, y: y + s * 0.22, w: s * 0.12, h: s * 0.12, fill: '#ffffff' });
      p.push({ t: 'rect', x: x + s * 0.44, y: y + s * 0.42, w: s * 0.12, h: s * 0.36, fill: '#ffffff' });

  }

  function fonts(theme) {
    var fam = theme.fontFamily;
    // Le nom, l'accroche et les titres de rubrique peuvent porter une AUTRE police
    // (association serif/sans) ; le corps garde la sienne.
    var head = theme.headingFamily || fam;
    var b = theme.baseSize;
    return {
      base: { family: fam, size: b },
      small: { family: fam, size: Math.max(6, b - 1) },
      entryTitle: { family: fam, size: b, bold: true },
      date: { family: fam, size: b, bold: true },
      org: { family: fam, size: b, italic: theme.organisationItalic },
      sectionTitle: { family: head, size: theme.sectionTitleSize, bold: theme.sectionTitleBold },
      name: { family: head, size: theme.nameSize, bold: true },
      headline: { family: head, size: theme.headlineSize },
    };
  }

  /** Fichier .ttf d'un couple (famille, style) — null pour une police standard du PDF. */
  function fontFile(family, style) {
    var meta = FAMILY_BY_KEY[family];
    if (!meta || meta.builtin) return null;
    var suffix = style === 'normal' ? 'regular' : style;
    return { key: family + ':' + style, family: family, style: style, file: family + '-' + suffix + '.ttf' };
  }

  /**
   * Couples (famille, style) RÉELLEMENT écrits dans ce document. Seuls ceux-là sont
   * téléchargés puis embarqués : un CV en Inter regular + bold ne fait pas voyager
   * l'italique ni les quatre autres familles.
   */
  function usedFonts(result) {
    var seen = {};
    var out = [];
    result.pages.forEach(function (pg) {
      pg.prims.forEach(function (p) {
        if (p.t !== 'text' || !p.s) return;
        var style = p.bold ? (p.italic ? 'bolditalic' : 'bold') : (p.italic ? 'italic' : 'normal');
        var entry = fontFile(p.fam, style);
        if (!entry || seen[entry.key]) return;
        seen[entry.key] = true;
        out.push(entry);
      });
    });
    return out;
  }

  /** Titre de rubrique + filet : la brique commune aux rubriques et au bloc contacts. */
  function titleBlock(rawLabel, width, theme, path) {
    return sectionTitleBlock({ title: rawLabel }, null, width, theme, path);
  }

  function sectionTitleBlock(section, index, width, theme, explicitPath) {
    var f = fonts(theme);
    var label = theme.sectionTitleUppercase ? section.title.toUpperCase() : section.title;
    // Le titre est COUPÉ à la largeur de sa colonne : dans un bandeau latéral étroit,
    // « FORMATIONS COMPLÉMENTAIRES » doit passer à la ligne, pas déborder sur le texte.
    var font = {
      family: f.sectionTitle.family, size: f.sectionTitle.size, bold: f.sectionTitle.bold,
      tracking: theme.sectionTitleUppercase ? theme.sectionTitleSize * 0.07 : 0,
    };

    var block = paragraphBlock(label, font, theme.accent, width, 1.15, { path: titlePath });
    var prims = block.prims;
    var h = block.h;
    if (theme.rules.enabled) {
      h += 3.5;   // → filet à 7,5 pt sous la ligne de base du titre (cote du modèle)
      prims.push({ t: 'rect', x: 0, y: h, w: width, h: theme.rules.thickness, fill: theme.rules.color });
      h += theme.rules.thickness;
    }
    h += theme.ruleGap;
    return { kind: 'title', h: h, prims: prims, keepWithNext: true, path: titlePath, sectionIndex: index };
  }

  /** Une entrée classique : titre + date alignée à droite, organisation, texte, puces. */
  function entryBlock(entry, path, width, theme, opts) {
    var f = fonts(theme);
    var lh = theme.lineHeight;
    // Dans la colonne principale, la ligne « structure / lieu » porte la couleur
    // d'accent ; dans le bandeau latéral elle reste noire (cote du modèle).
    var orgColor = (opts && opts.orgColor) || theme.accent;
    var prims = [];
    var y = 0;

    var dateW = entry.date ? measureText(entry.date, f.date) : 0;
    var titleColor = theme.entryTitleColor || theme.textColor;
    if (entry.title || entry.date) {
      var titleW = entry.date ? Math.max(20, width - dateW - 10) : width;
      var block = paragraphBlock(entry.title || '', f.entryTitle, titleColor, titleW, lh, { path: path + '.title' });
      prims = prims.concat(translate(block.prims, 0, y));
      if (entry.date) {
        var dlb = lineBox(f.date.size, lh);
        prims.push(textPrim(entry.date, width, y + dlb.baseline, f.date, theme.accent, {
          align: 'right', path: path + '.date',
        }));
      }
      y += Math.max(block.h, entry.date ? lineBox(f.entryTitle.size, lh).h : 0);
    }
    if (entry.organisation) {
      var org = paragraphBlock(entry.organisation, f.org, orgColor, width, lh, { path: path + '.organisation' });
      prims = prims.concat(translate(org.prims, 0, y));
      y += org.h;
    }
    for (var i = 0; i < entry.description.length; i++) {
      // Pas d'espace ajouté : un paragraphe suit l'organisation à l'interligne courant.
      var par = paragraphBlock(entry.description[i], f.base, theme.textColor, width, lh, {
        path: path + '.description.' + i,
        underline: i === 0 ? entry.underline : '',
      });
      prims = prims.concat(translate(par.prims, 0, y));
      y += par.h;
    }
    if (entry.bullets.length) {
      var indent = theme.bulletIndent;
      var glyphW = Math.max(1.1, theme.baseSize * 0.16);
      var bulletColor = theme.bulletColor || theme.textColor;
      // Le modèle saute une ligne entière avant la première puce.
      if (y > 0) y += lineBox(f.base.size, lh).h;
      for (var b = 0; b < entry.bullets.length; b++) {
        var bp = paragraphBlock(entry.bullets[b], f.base, theme.textColor, width - indent, lh, {
          path: path + '.bullets.' + b,
        });
        var blb = lineBox(f.base.size, lh);
        if (theme.bulletStyle === 'disc') {
          prims.push({ t: 'circle', cx: indent * 0.5, cy: y + blb.baseline - theme.baseSize * 0.28, r: glyphW, fill: bulletColor });
        } else if (theme.bulletStyle === 'square') {
          prims.push({ t: 'rect', x: indent * 0.5 - glyphW, y: y + blb.baseline - theme.baseSize * 0.28 - glyphW, w: glyphW * 2, h: glyphW * 2, fill: bulletColor });
        } else if (theme.bulletStyle === 'dash') {
          prims.push({ t: 'rect', x: indent * 0.28, y: y + blb.baseline - theme.baseSize * 0.28, w: theme.baseSize * 0.42, h: Math.max(0.5, theme.baseSize * 0.07), fill: bulletColor });
        }
        prims = prims.concat(translate(bp.prims, indent, y));
        y += bp.h;
      }
    }
    return { kind: 'entry', h: y, prims: prims, path: path };
  }

  /** Langues / compétences notées : libellé + jauge de 5 pastilles. */
  function ratingBlock(entry, path, width, theme) {
    var f = fonts(theme);
    var lh = theme.lineHeight;
    var prims = [];
    var lb = lineBox(f.base.size, lh);
    var dotR = theme.baseSize * 0.26;
    var gap = dotR * 3.4;
    var hasRating = typeof entry.rating === 'number' && entry.rating > 0;
    var gaugeW = hasRating ? gap * 4 + dotR * 2 : 0;
    var labelW = Math.max(20, width - gaugeW - (hasRating ? 8 : 0));
    var label = paragraphBlock(entry.title || '', f.base, theme.textColor, labelW, lh, { path: path + '.title' });
    prims = prims.concat(label.prims);
    var y = label.h;
    if (hasRating) {
      var cy = lb.baseline - theme.baseSize * 0.3;
      for (var i = 0; i < 5; i++) {
        prims.push({
          t: 'circle', cx: width - gaugeW + dotR + i * gap, cy: cy, r: dotR,
          fill: i < entry.rating ? theme.accent : mixColor(theme.accent, '#ffffff', 0.5),
        });
      }
    }
    if (entry.organisation) {
      var sub = paragraphBlock(entry.organisation, f.small, theme.mutedColor, width, lh, { path: path + '.organisation' });
      prims = prims.concat(translate(sub.prims, 0, y));
      y += sub.h;
    }
    return { kind: 'entry', h: y, prims: prims, path: path };
  }

  /** Étiquettes (compétences, centres d'intérêt) : pastilles qui s'enroulent. */
  function tagBlocks(section, index, width, theme) {
    var f = fonts(theme);
    var padX = theme.baseSize * 0.55;
    var padY = theme.baseSize * 0.3;
    var gapX = theme.baseSize * 0.42;
    var gapY = theme.baseSize * 0.36;
    var chipH = theme.baseSize + padY * 2;

    var row = [];

    for (var i = 0; i < section.entries.length; i++) {
      var label = section.entries[i].title;
      if (!label) continue;
      var path = 'sections.' + index + '.entries.' + i + '.title';
      var natural = measureText(label, f.base) + padX * 2;
      if (natural > width) {
        // Étiquette plus large que la colonne : elle prend sa propre ligne et son
        // texte est COUPÉ (jamais tronqué : on ne perd pas un mot du CV).
        if (row.length) { rows.push(row); row = []; x = 0; }
        rows.push([{ label: label, w: width, x: 0, path: path, wrap: true }]);
        continue;
      }
      if (row.length && x + natural > width) { rows.push(row); row = []; x = 0; }
      row.push({ label: label, w: natural, x: x, path: path });
      x += natural + gapX;
    }
    if (row.length) rows.push(row);

    return rows.map(function (r, ri) {
      var prims = [];
      var lb = lineBox(f.base.size, 1);
      var h = chipH;
      for (var j = 0; j < r.length; j++) {
        if (r[j].wrap) {
          var par = paragraphBlock(r[j].label, f.base, theme.accent, r[j].w - padX * 2, 1.2, { path: r[j].path });
          h = Math.max(h, par.h + padY * 2);
          prims.push({ t: 'rect', x: 0, y: 0, w: r[j].w, h: par.h + padY * 2, fill: mixColor(theme.accent, '#ffffff', 0.88), r: chipH / 2 });
          prims = prims.concat(translate(par.prims, padX, padY));
          continue;
        }
        prims.push({ t: 'rect', x: r[j].x, y: 0, w: r[j].w, h: chipH, fill: mixColor(theme.accent, '#ffffff', 0.88), r: chipH / 2 });
        prims.push(textPrim(r[j].label, r[j].x + padX, padY + lb.baseline, f.base, theme.accent, { path: r[j].path }));
      }
      return { kind: 'entry', h: h + (ri < rows.length - 1 ? gapY : 0), prims: prims, path: 'sections.' + index };
    });
  }

  /**
   * Liste à puces simple (centres d'intérêt, compétences) : une entrée = une ligne
   * précédée d'une petite puce carrée. C'est la forme du modèle de référence, plus
   * sobre que les étiquettes arrondies.
   */
  function listBlock(entry, path, width, theme) {
    // Une ligne vide ne dessine RIEN : sans ça, une entrée qu'on vient d'ajouter
    // laisserait une puce orpheline dans l'aperçu et dans le PDF exporté.
    if (!entry.title) return { kind: 'entry', h: 0, prims: [], path: path };
    var f = fonts(theme);
    var indent = theme.baseSize * 1.75;
    var glyph = Math.max(1.1, theme.baseSize * 0.19);
    var color = theme.bulletColor || theme.accent;
    var par = paragraphBlock(entry.title, f.base, theme.textColor, width - indent, theme.lineHeight, { path: path + '.title' });
    var lb = lineBox(f.base.size, theme.lineHeight);
    var prims = [{ t: 'rect', x: 0, y: lb.baseline - theme.baseSize * 0.28 - glyph, w: glyph * 2, h: glyph * 2, fill: color }];
    return { kind: 'entry', h: par.h, prims: prims.concat(translate(par.prims, indent, 0)), path: path };
  }

  /** Construit tous les blocs d'une section (titre + contenu selon le layout). */
  function sectionBlocks(section, index, width, theme) {
    var blocks = [];
    if (section.title) blocks.push(sectionTitleBlock(section, index, width, theme));
    var path = function (i) { return 'sections.' + index + '.entries.' + i; };

    if (section.layout === 'tags') {
      blocks = blocks.concat(tagBlocks(section, index, width, theme));
    } else if (section.layout === 'list') {
      section.entries.forEach(function (e, i) {
        var b = listBlock(e, path(i), width, theme);
        b.h += theme.entryGap;
        b.trailingGap = theme.entryGap;
        blocks.push(b);
      });
    } else if (section.layout === 'ratings') {
      section.entries.forEach(function (e, i) {
        var b = ratingBlock(e, path(i), width, theme);
        b.h += theme.entryGap;
        b.trailingGap = theme.entryGap;
        blocks.push(b);
      });
    } else if (section.layout === 'text') {
      section.entries.forEach(function (e, i) {
        var texts = e.description.length ? e.description : (e.title ? [e.title] : []);
        texts.forEach(function (t, j) {
          var par = paragraphBlock(t, fonts(theme).base, theme.textColor, width, theme.lineHeight, {
            path: path(i) + (e.description.length ? '.description.' + j : '.title'),
            underline: j === 0 ? e.underline : '',
          });
          blocks.push({ kind: 'entry', h: par.h + theme.entryGap, prims: par.prims, path: path(i) });
        });
      });
    } else {
      var orgColor = section.column === 'side' ? theme.textColor : theme.accent;
      section.entries.forEach(function (e, i) {
        var b = entryBlock(e, path(i), width, theme, { orgColor: orgColor });
        b.h += theme.blockGap;
        b.trailingGap = theme.blockGap;
        blocks.push(b);
      });
    }
    if (blocks.length) {
      // La dernière entrée ne porte pas l'espace inter-entrées : c'est `sectionGap`
      // qui sépare deux rubriques (28,7 pt de ligne à ligne dans le modèle).
      var last = blocks[blocks.length - 1];
      if (last.trailingGap) last.h -= last.trailingGap;
      last.h += theme.sectionGap;
      last.isSectionEnd = true;
    }
    if (blocks.length && section.pageBreakBefore) blocks[0].pageBreakBefore = true;
    return blocks;
  }

  /**
   * Liste de contacts : pictogramme + valeur. En colonne (bandeau) l'écart d'un

   * référence, qui aère beaucoup cette zone.
   */

    opts = opts || {};

    var iconColor = opts.iconColor || theme.accent;

    var y = 0;

    if (opts.inline) {
      // Bandeau pleine largeur : les contacts s'enroulent sur une ou plusieurs lignes.
      var x = 0;
      var lb = lineBox(f.small.size, Math.max(1.25, lh));
      var gapX = theme.baseSize * 1.4;
      for (var k = 0; k < contacts.length; k++) {
        var c = contacts[k];
        if (!c.value) continue;
        var label = theme.contactStyle === 'label' ? CONTACT_LABELS[c.icon] + ' ' + c.value : c.value;
        var w = measureText(label, f.small) + (theme.contactStyle === 'icon' ? iconSize * 0.8 + theme.baseSize * 0.4 : 0);
        if (x > 0 && x + w > width) { x = 0; y += Math.max(lb.h, iconSize * 0.9); }
        if (theme.contactStyle === 'icon') {
          prims = prims.concat(contactIcon(c.icon, x, y + lb.baseline - iconSize * 0.4 - f.small.size * 0.05, iconSize * 0.8, iconColor));
          x += iconSize * 0.8 + theme.baseSize * 0.4;
        }
        prims.push(textPrim(label, x, y + lb.baseline, f.small, color, {
          path: 'header.contacts.' + k + '.value', link: c.href || '',
        }));
        x += measureText(label, f.small) + gapX;
      }
      return { h: y + Math.max(lb.h, iconSize * 0.9), prims: prims };
    }

    var rendered = 0;
    for (var i = 0; i < contacts.length; i++) {
      var ct = contacts[i];
      if (!ct.value) continue;
      rendered++;
      var text = theme.contactStyle === 'label' ? CONTACT_LABELS[ct.icon] + ' : ' + ct.value : ct.value;
      var par = paragraphBlock(text, f.base, color, width - indent, lh, {
        path: 'header.contacts.' + i + '.value', link: ct.href || '',
      });
      var lbc = lineBox(f.base.size, lh);
      if (theme.contactStyle === 'icon') {
        // Pictogramme centré sur la ligne de base, comme dans le modèle.
        prims = prims.concat(contactIcon(ct.icon, 0, lbc.baseline - iconSize * 0.5 - f.base.size * 0.05 + y, iconSize, iconColor));
      }
      prims = prims.concat(translate(par.prims, indent, y));
      var rowH = theme.contactGap + Math.max(0, par.h - lbc.h);
      var isLast = contacts.slice(i + 1).every(function (c) { return !c.value; });
      y += isLast ? Math.max(par.h, iconSize) : rowH;
    }
    if (!rendered) return { h: 0, prims: [] };
    return { h: y, prims: prims };
  }

  function photoPrims(photo, x, y, size) {
    if (!photo) return [];
    return [{ t: 'image', x: x, y: y, w: size, h: size, src: photo.dataUrl, shape: photo.shape, zoom: photo.zoom, offsetX: photo.offsetX, offsetY: photo.offsetY }];
  }

  /**
   * En-tête. Deux partis pris assumés :
   *  • 'split'  : photo + contacts dans le bandeau latéral, nom + accroche dans la
   *               colonne principale (CV médical classique) ;
   *  • 'band'   : bandeau pleine largeur en haut de la première page.
   */
  function buildHeader(doc, geo, theme) {
    var f = fonts(theme);
    var h = doc.header;
    var out = { mainPrims: [], sidePrims: [], bandPrims: [], mainTop: geo.contentTop, sideTop: geo.contentTop, bandBottom: 0 };

    if (theme.headerStyle === 'split' && geo.sidebarOn) {
      var sy = 0;
      var sPrims = [];
      if (h.photo) {
        var size = Math.min(theme.photoSize, geo.sideContentW);
        sPrims = sPrims.concat(photoPrims(h.photo, (geo.sideContentW - size) / 2, sy, size));
        sy += size + theme.photoGap;
      }
      var hasContact = h.contacts.some(function (c) { return !!c.value; });
      if (hasContact) {
        if (theme.contactsTitle) {
          var tb = titleBlock(theme.contactsTitle, geo.sideContentW, theme, 'theme.contactsTitle');
          sPrims = sPrims.concat(translate(tb.prims, 0, sy));
          sy += tb.h;
        }
        var cb = contactsBlock(h.contacts, geo.sideContentW, theme, {});
        sPrims = sPrims.concat(translate(cb.prims, 0, sy));
        sy += cb.h + theme.sectionGap;
      }
      out.sidePrims = translate(sPrims, geo.sideContentX, geo.contentTop);
      out.sideTop = geo.contentTop + sy;

      var my = 0;
      var mPrims = [];
      if (h.fullName) {
        var nb = paragraphBlock(h.fullName, f.name, theme.nameColor || theme.accent, geo.mainW, 1.4, { path: 'header.fullName' });
        mPrims = mPrims.concat(nb.prims);
        my += nb.h;
      }
      if (h.headline) {
        my += theme.baseSize * 0.4;
        var hb = paragraphBlock(h.headline, f.headline, theme.textColor, geo.mainW, 1.25, { path: 'header.headline' });
        mPrims = mPrims.concat(translate(hb.prims, 0, my));
        my += hb.h;
      }
      if (my > 0) my += theme.headerGap;
      out.mainPrims = translate(mPrims, geo.mainX, geo.contentTop);
      out.mainTop = geo.contentTop + my;
      return out;
    }

    // ── Bandeau pleine largeur ──────────────────────────────────────────────
    var bandX = theme.margins.left;
    var bandW = A4.w - theme.margins.left - theme.margins.right;
    var photoSize = h.photo ? Math.min(theme.photoSize, bandW * 0.28) : 0;
    var textW = bandW - (photoSize ? photoSize + theme.blockGap * 1.5 : 0);
    var prims = [];
    var y = 0;
    if (h.fullName) {
      var n2 = paragraphBlock(h.fullName, f.name, theme.nameColor || theme.accent, textW, 1.2, { path: 'header.fullName' });
      prims = prims.concat(n2.prims);
      y += n2.h;
    }
    if (h.headline) {
      y += theme.baseSize * 0.3;
      var h2 = paragraphBlock(h.headline, f.headline, theme.textColor, textW, 1.25, { path: 'header.headline' });
      prims = prims.concat(translate(h2.prims, 0, y));
      y += h2.h;
    }
    if (h.contacts.some(function (c) { return !!c.value; })) {
      y += theme.baseSize * 0.7;
      var cb2 = contactsBlock(h.contacts, textW, theme, { inline: true });
      prims = prims.concat(translate(cb2.prims, 0, y));
      y += cb2.h;
    }
    if (photoSize) {
      prims = prims.concat(photoPrims(h.photo, bandW - photoSize, 0, photoSize));
      y = Math.max(y, photoSize);
    }
    if (y > 0 && theme.rules.enabled) {
      y += theme.baseSize * 0.6;
      prims.push({ t: 'rect', x: 0, y: y, w: bandW, h: theme.rules.thickness, fill: theme.rules.color });
      y += theme.rules.thickness;
    }
    out.bandPrims = translate(prims, bandX, geo.contentTop);
    out.bandBottom = y > 0 ? geo.contentTop + y + theme.blockGap * 1.3 : geo.contentTop;
    out.mainTop = out.bandBottom;
    out.sideTop = out.bandBottom + (geo.sidebarOn ? theme.sidebar.padding : 0);
    return out;
  }

  function geometry(doc, theme) {
    var m = theme.margins;
    var sb = theme.sidebar;
    var hasSide = doc.sections.some(function (s) { return s.column === 'side'; });
    var hasContact = doc.header.contacts.some(function (c) { return !!c.value; });
    var sidebarOn = sb.enabled && (hasSide || (theme.headerStyle === 'split' && (doc.header.photo || hasContact)));
    var geo = {
      sidebarOn: sidebarOn,
      contentTop: m.top,
      contentBottom: A4.h - m.bottom,
      sideX: 0, sideW: 0, sideContentX: 0, sideContentW: 0, stripeX: 0, stripeW: 0,
      mainX: m.left, mainW: A4.w - m.left - m.right,
    };
    if (sidebarOn) {
      // `sidebar.width` est la largeur TOTALE de la bande ; le liseré est découpé
      // dedans, au bord de la page (c'est ainsi que le modèle de référence est bâti).
      var stripeW = theme.stripe.enabled ? Math.min(theme.stripe.width, sb.width - 2 * sb.padding - 10) : 0;
      geo.stripeW = Math.max(0, stripeW);
      geo.sideW = sb.width;
      geo.sideX = sb.side === 'left' ? 0 : A4.w - sb.width;
      geo.stripeX = sb.side === 'left' ? 0 : A4.w - geo.stripeW;
      geo.sideContentX = geo.sideX + (sb.side === 'left' ? geo.stripeW : 0) + sb.padding;
      geo.sideContentW = sb.width - geo.stripeW - sb.padding * 2;
      geo.mainX = sb.side === 'left' ? sb.width + sb.gap : m.left;
      geo.mainW = sb.side === 'left' ? A4.w - geo.mainX - m.right : A4.w - sb.width - sb.gap - m.left;
    }
    return geo;
  }

  /**
   * Répartit des blocs en pages pour UNE colonne.
   * Règles (testées) :
   *  • une entrée n'est jamais coupée en deux ;
   *  • un titre de rubrique n'est jamais orphelin en bas de page (au moins une
   *    entrée doit le suivre sur la même page) ;
   *  • `pageBreakBefore` force une nouvelle page pour la rubrique.
   * Un bloc plus haut qu'une page entière est placé quand même et signalé
   * (`oversize`) : on ne masque jamais du contenu.
   */
  function flowColumn(blocks, firstTop, top, bottom) {
    var placed = [];
    var page = 0;
    var y = firstTop;
    var pageTop = firstTop;
    var oversize = [];

    for (var i = 0; i < blocks.length; i++) {
      var b = blocks[i];
      var need = b.h;
      if (b.keepWithNext && blocks[i + 1]) need += blocks[i + 1].h;

      if (b.pageBreakBefore && y > pageTop) { page++; y = top; pageTop = top; }

      if (y + need > bottom && y > pageTop) { page++; y = top; pageTop = top; }
      if (b.h > bottom - top) oversize.push(b.path || String(i));

      placed.push({ page: page, x: 0, y: y, block: b });
      y += b.h;
    }
    return { placed: placed, pages: placed.length ? placed[placed.length - 1].page + 1 : 0, lastY: y, oversize: oversize };
  }

  /**
   * Calcule la mise en page complète : pages, primitives de fond, primitives de
   * contenu (dans l'ORDRE DE LECTURE : en-tête, colonne principale, bandeau),
   * taux de remplissage et avertissements.
   */
  function layout(input) {
    var doc = input && input.schemaVersion === SCHEMA_VERSION ? input : migrate(input);
    var theme = doc.theme;
    var geo = geometry(doc, theme);
    var header = buildHeader(doc, geo, theme);

    var mainBlocks = [];
    var sideBlocks = [];
    doc.sections.forEach(function (s, i) {
      var toSide = geo.sidebarOn && s.column === 'side';
      var width = toSide ? geo.sideContentW : geo.mainW;
      var blocks = sectionBlocks(s, i, width, theme);
      (toSide ? sideBlocks : mainBlocks).push.apply(toSide ? sideBlocks : mainBlocks, blocks);
    });

    var mainFlow = flowColumn(mainBlocks, header.mainTop, geo.contentTop, geo.contentBottom);
    var sideFlow = flowColumn(sideBlocks, header.sideTop, geo.sidebarOn && theme.headerStyle === 'split' ? geo.contentTop : geo.contentTop, geo.contentBottom);

    var pageCount = Math.max(1, mainFlow.pages, sideFlow.pages);
    var pages = [];
    for (var p = 0; p < pageCount; p++) {
      pages.push({ index: p, bg: [], prims: [], mainBottom: header.mainTop, sideBottom: header.sideTop });
    }

    // Fonds : bandeau latéral pleine hauteur (jusqu'aux bords de la page) + liseré.
    if (geo.sidebarOn) {
      for (var pi = 0; pi < pageCount; pi++) {
        var topY = pi === 0 && theme.headerStyle === 'band' ? header.bandBottom - theme.blockGap * 0.6 : 0;
        pages[pi].bg.push({ t: 'rect', x: geo.sideX, y: topY, w: geo.sideW, h: A4.h - topY, fill: theme.sidebarBackground });
        if (geo.stripeW > 0) {
          pages[pi].bg.push({ t: 'rect', x: geo.stripeX, y: topY, w: geo.stripeW, h: A4.h - topY, fill: theme.stripe.color });
        }
      }
    } else if (theme.stripe.enabled && theme.stripe.width > 0) {
      for (var pj = 0; pj < pageCount; pj++) {
        var stripeX = theme.sidebar.side === 'right' ? A4.w - theme.stripe.width : 0;
        pages[pj].bg.push({ t: 'rect', x: stripeX, y: 0, w: theme.stripe.width, h: A4.h, fill: theme.stripe.color });
      }
    }

    // Contenu, dans l'ordre de lecture (c'est celui qu'extraira un ATS).
    pages[0].prims = pages[0].prims.concat(header.bandPrims, header.mainPrims);
    mainFlow.placed.forEach(function (pl) {
      pages[pl.page].prims = pages[pl.page].prims.concat(translate(pl.block.prims, geo.mainX, pl.y));
      pages[pl.page].mainBottom = Math.max(pages[pl.page].mainBottom, pl.y + pl.block.h);
    });
    pages[0].prims = pages[0].prims.concat(header.sidePrims);
    if (header.sidePrims.length) pages[0].sideBottom = header.sideTop;
    sideFlow.placed.forEach(function (pl) {
      pages[pl.page].prims = pages[pl.page].prims.concat(translate(pl.block.prims, geo.sideContentX, pl.y));
      pages[pl.page].sideBottom = Math.max(pages[pl.page].sideBottom, pl.y + pl.block.h);
    });

    // Taux de remplissage : hauteur utile occupée sur la page / hauteur disponible.
    var avail = geo.contentBottom - geo.contentTop;
    pages.forEach(function (pg) {
      var used = Math.max(pg.mainBottom, pg.sideBottom) - geo.contentTop;
      pg.fill = Math.max(0, Math.min(1, used / avail));
    });

    var warnings = [];
    var last = pages[pages.length - 1];
    if (pageCount > 1 && last.fill < 0.6) {
      warnings.push({
        code: 'underfilled',
        page: pageCount,
        message: 'La page ' + pageCount + ' n\'est remplie qu\'à ' + Math.round(last.fill * 100) + ' %.',
        hint: 'Déplace une rubrique vers le bandeau, augmente l\'interligne ou l\'espace entre blocs, ou utilise « Ajuster » pour tenir en ' + (pageCount - 1) + ' page(s).',
      });
    }
    mainFlow.oversize.concat(sideFlow.oversize).forEach(function (path) {
      warnings.push({
        code: 'oversize', path: path,
        message: 'Une entrée est plus haute qu\'une page entière : elle déborde.',
        hint: 'Coupe-la en deux entrées ou raccourcis ses puces.',
      });
    });

    return {
      doc: doc, theme: theme, geo: geo, pages: pages, pageCount: pageCount,
      page: { width: A4.w, height: A4.h },
      warnings: warnings,
    };
  }

  /** Texte du CV dans l'ordre où un ATS le lira (= ordre de dessin). */
  function extractText(result) {
    return result.pages.map(function (pg) {
      return pg.prims.filter(function (p) { return p.t === 'text' && p.s; })
        .map(function (p) { return p.s; }).join('\n');
    }).join('\n\f\n');
  }

  // ── « Ajuster pour tenir en N pages » ─────────────────────────────────────
  //  Une descente DÉTERMINISTE et bornée : on resserre d'abord les espaces, puis
  //  l'interligne, puis (en dernier) le corps de texte et les marges. Si aucun
  //  palier ne suffit, on le DIT — on ne rend jamais un CV illisible en douce.

  var FIT_STEPS = [
    { blockGap: -1 },
    { blockGap: -2, entryGap: -0.5 },
    { blockGap: -3, entryGap: -1, ruleGap: -1 },
    { blockGap: -3, entryGap: -1, ruleGap: -2, lineHeight: -0.04 },
    { blockGap: -4, entryGap: -1.5, ruleGap: -2, lineHeight: -0.08 },
    { blockGap: -5, entryGap: -2, ruleGap: -3, lineHeight: -0.10, margins: -4 },
    { blockGap: -5, entryGap: -2, ruleGap: -3, lineHeight: -0.12, margins: -6, baseSize: -0.25 },
    { blockGap: -6, entryGap: -2, ruleGap: -4, lineHeight: -0.14, margins: -8, baseSize: -0.5 },
    { blockGap: -6, entryGap: -2.5, ruleGap: -4, lineHeight: -0.16, margins: -10, baseSize: -0.75 },
    { blockGap: -7, entryGap: -3, ruleGap: -5, lineHeight: -0.18, margins: -12, baseSize: -1 },
  ];
  /** Planchers de LISIBILITÉ : on ne descend jamais en dessous, même pour gagner une page. */
  var FIT_FLOOR = { blockGap: 3, entryGap: 0, ruleGap: 3, lineHeight: 1.08, baseSize: 8, margin: 24 };

  function applyFitStep(theme, step) {
    var t = JSON.parse(JSON.stringify(theme));
    if (step.blockGap) t.blockGap = Math.max(FIT_FLOOR.blockGap, theme.blockGap + step.blockGap);
    if (step.entryGap) t.entryGap = Math.max(FIT_FLOOR.entryGap, theme.entryGap + step.entryGap);
    if (step.ruleGap) t.ruleGap = Math.max(FIT_FLOOR.ruleGap, theme.ruleGap + step.ruleGap);
    if (step.lineHeight) t.lineHeight = Math.max(FIT_FLOOR.lineHeight, theme.lineHeight + step.lineHeight);
    if (step.baseSize) t.baseSize = Math.max(FIT_FLOOR.baseSize, theme.baseSize + step.baseSize);
    if (step.margins) {
      ['top', 'right', 'bottom', 'left'].forEach(function (k) {
        t.margins[k] = Math.max(FIT_FLOOR.margin, theme.margins[k] + step.margins);
      });
    }
    return normalizeTheme(t);
  }

  /**
   * Cherche le réglage le MOINS agressif qui fasse tenir le CV en `target` pages.
   * Renvoie { ok, pages, theme, step, message } — `ok:false` si même le palier le
   * plus serré ne suffit pas (le thème n'est alors PAS modifié).
   */
  function fitToPages(doc, target) {
    var pages = layout(doc).pageCount;
    if (pages <= target) {
      return { ok: true, pages: pages, theme: doc.theme, step: -1, changed: false, message: 'Le CV tient déjà en ' + pages + ' page(s).' };
    }
    for (var i = 0; i < FIT_STEPS.length; i++) {
      var theme = applyFitStep(doc.theme, FIT_STEPS[i]);
      var trial = { schemaVersion: SCHEMA_VERSION, meta: doc.meta, header: doc.header, sections: doc.sections, theme: theme };
      var got = layout(trial).pageCount;
      if (got <= target) {
        return { ok: true, pages: got, theme: theme, step: i, changed: true, message: 'Ajusté en ' + got + ' page(s) (palier ' + (i + 1) + '/' + FIT_STEPS.length + ').' };
      }
    }
    var floorTheme = applyFitStep(doc.theme, FIT_STEPS[FIT_STEPS.length - 1]);
    var floorPages = layout({ schemaVersion: SCHEMA_VERSION, meta: doc.meta, header: doc.header, sections: doc.sections, theme: floorTheme }).pageCount;
    return {
      ok: false, pages: pages, theme: doc.theme, step: -1, changed: false,
      message: 'Impossible de tenir en ' + target + ' page(s) sans passer sous les limites de lisibilité (au mieux ' +
        floorPages + ' pages). Retire ou raccourcis du contenu.',
    };
  }

  // ── Contrôles de lisibilité ───────────────────────────────────────────────

  /** Contrastes WCAG des couples réellement utilisés à l'impression. */
  function contrastReport(doc) {
    var t = doc.theme;
    var geo = geometry(doc, t);
    var checks = [
      { label: 'Texte courant sur fond blanc', fg: t.textColor, bg: '#ffffff', required: 4.5 },
      { label: 'Texte secondaire sur fond blanc', fg: t.mutedColor, bg: '#ffffff', required: 4.5 },
      { label: 'Titres de rubrique (couleur d\'accent)', fg: t.accent, bg: '#ffffff', required: 4.5 },
    ];
    if (geo.sidebarOn) {
      checks.push({ label: 'Texte du bandeau latéral', fg: t.textColor, bg: t.sidebarBackground, required: 4.5 });
      checks.push({ label: 'Titres dans le bandeau latéral', fg: t.accent, bg: t.sidebarBackground, required: 4.5 });
      checks.push({ label: 'Texte secondaire du bandeau', fg: t.mutedColor, bg: t.sidebarBackground, required: 4.5 });
    }
    return checks.map(function (c) {
      var ratio = contrastRatio(c.fg, c.bg);
      return { label: c.label, fg: c.fg, bg: c.bg, ratio: ratio, required: c.required, ok: ratio >= c.required };
    });
  }

  /** Caractères que les polices PDF standard ne savent pas écrire (rendus « ? »). */
  function unsupportedCharacters(doc) {
    var seen = {};
    var visit = function (s) {
      if (!s) return;
      for (var i = 0; i < s.length; i++) {
        var ch = s.charAt(i);
        if (ch === '\n' || ch === '\t') continue;
        if (!isSupportedChar(ch)) seen[ch] = true;
      }
    };
    visit(doc.header.fullName); visit(doc.header.headline);
    doc.header.contacts.forEach(function (c) { visit(c.value); });
    doc.sections.forEach(function (s) {
      visit(s.title);
      s.entries.forEach(function (e) {
        visit(e.title); visit(e.date); visit(e.organisation);
        e.description.forEach(visit); e.bullets.forEach(visit);
      });
    });
    return Object.keys(seen);
  }

  /**
   * Nettoyage d'un collage (Word, PDF, page web) : on ne garde que du TEXTE.
   * Les listes à puces deviennent des puces du CV, les paragraphes restent des
   * paragraphes. Aucun style importé (le thème du CV reste maître).
   */
  function cleanPastedText(raw) {
    var text = String(raw === null || raw === undefined ? '' : raw)
      .replace(/\r\n?/g, '\n')
      .replace(/[\u00ad\u200b-\u200f\u202a-\u202e\ufeff]/g, '')  // invisibles (Word, PDF)
      .replace(/[\u00a0\u2007\u202f]/g, ' ')                       // espaces insécables
      .replace(/[ \t]+/g, ' ');
    var lines = text.split('\n').map(function (l) { return l.trim(); });
    var bullets = [];
    var paragraphs = [];
    var buffer = [];
    var flush = function () {
      var p = buffer.join(' ').trim();
      if (p) paragraphs.push(p);
      buffer = [];
    };
    lines.forEach(function (line) {
      if (!line) { flush(); return; }
      var m = line.match(/^([•▪●◦‣⁃*–—-]|\d{1,2}[.)])\s+(.*)$/);
      if (m && m[2].trim()) { flush(); bullets.push(m[2].trim()); return; }
      buffer.push(line);
    });
    flush();
    return { paragraphs: paragraphs, bullets: bullets };
  }

  // ── Modèles de départ ─────────────────────────────────────────────────────
  //  Des POINTS DE DÉPART, pas des gabarits figés : chaque libellé de rubrique
  //  est modifiable, chaque rubrique déplaçable. Aucun contenu n'est inventé :
  //  ce sont des intitulés génériques que l'utilisateur remplace par les siens.

  function E(title, date, org, desc, bullets) {
    return normalizeEntry({ title: title, date: date, organisation: org, description: desc || [], bullets: bullets || [] });
  }
  function S(title, column, layoutKind, entries) {
    return normalizeSection({ title: title, column: column, layout: layoutKind, entries: entries });
  }

  function buildTemplate(key) {
    var doc = blankDocument();
    doc.theme = defaultTheme(key === 'academique' ? 'bordeaux' : key === 'assistanat-ch' ? 'nuit' : 'rouge');
    doc.header.contacts = [
      normalizeContact({ icon: 'person', value: 'Prénom NOM' }),
      normalizeContact({ icon: 'email', value: 'prenom.nom@exemple.fr' }),
      normalizeContact({ icon: 'phone', value: '+33 6 00 00 00 00' }),
      normalizeContact({ icon: 'home', value: 'Ville, France' }),
      normalizeContact({ icon: 'flag', value: 'Française' }),
    ];

    if (key === 'assistanat-ch') {
      doc.theme.fontFamily = 'helvetica';
      doc.meta.title = 'CV candidature assistanat (Suisse)';
      doc.header.headline = 'Médecin diplômé(e) — candidature au poste de médecin assistant(e).';
      doc.header.contacts[3] = normalizeContact({ icon: 'home', value: 'Ville, Suisse' });
      doc.header.contacts.push(normalizeContact({ icon: 'calendar', value: '01.01.1998' }));
